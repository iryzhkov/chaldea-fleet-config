---
name: ci
"on":
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: [self-hosted, Linux, X64, chaldea-fleet-config]
    env:
      CI_PYTHON: /usr/bin/python3.13
      ANSIBLE_FORKS: "1"
      TMPDIR: /home/igor/.cache/chaldea-scratch/laneC/fleet-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: mkdir -p "$TMPDIR"
      - run: bash tools/ci.sh
      - name: Remove this run's disk-backed scratch
        if: always()
        run: rm -rf -- "$TMPDIR"
