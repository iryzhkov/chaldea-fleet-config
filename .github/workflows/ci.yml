---
name: ci
"on":
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        phase: [pytest-skills, pytest-roles, pytest-rest, converge]
    # GitHub-hosted: the repository is public, and a self-hosted runner would
    # run pull requests from forks on a fleet host.
    runs-on: ubuntu-24.04
    # Pytest and synthetic convergence are independent; retain every gate.
    timeout-minutes: 45
    env:
      ANSIBLE_FORKS: "1"
      TMPDIR: ${{ github.workspace }}/../chaldea-fleet-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.phase }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - run: echo "CI_PYTHON=${{ steps.python.outputs.python-path }}" >>"$GITHUB_ENV"
      - run: mkdir -p "$TMPDIR"
      # Same reviewed Linux x64 archive pin as inventory/group_vars/all/main.yml.
      # Keep Node in this run's scratch, independent of the isolated test HOME.
      - name: Stage checksum-pinned Node for this CI job
        shell: bash
        env:
          CI_NODE_VERSION: "26.12.0"
          CI_NODE_SHA256: fd47865ecd6391ebb431fc815e01b9135bf83ded5cf373247e9331e196b7aded
        run: |
          set -euo pipefail
          node_scratch=$(mktemp -d "$TMPDIR/node.XXXXXXXX")
          archive="node-v$CI_NODE_VERSION-linux-x64.tar.xz"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://nodejs.org/dist/v$CI_NODE_VERSION/$archive" \
            --output "$node_scratch/$archive"
          printf '%s  %s\n' "$CI_NODE_SHA256" "$node_scratch/$archive" | sha256sum --check -
          mkdir "$node_scratch/runtime"
          tar --extract --xz --file "$node_scratch/$archive" \
            --directory "$node_scratch/runtime" --strip-components=1 --no-same-owner
          test "$("$node_scratch/runtime/bin/node" --version)" = "v$CI_NODE_VERSION"
          printf '%s\n' "$node_scratch/runtime/bin" >>"$GITHUB_PATH"
      - run: bash tools/ci.sh "${{ matrix.phase }}"
      - name: Remove this run's disk-backed scratch
        if: always()
        run: rm -rf -- "$TMPDIR"
  ci:
    # Preserve the required check name; every matrix lane must succeed.
    if: always()
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all complete verification lanes
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
