---
name: ci
"on":
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
      - run: bash tools/with-ci-env.sh python3 -m unittest discover -s tests -v
      - run: bash tools/with-ci-env.sh ansible-lint
