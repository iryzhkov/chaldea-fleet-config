---
# Enabled 2026-10-17 at Igor's direction, after the timers gained outcome
# reporting (feed on hosts with a feed key, a bounded local status file on the
# others) and after Igor reviewed each host's retention dry run. Servers
# (normandy, homelab) keep the defaults in all.yml, which leave both off.
pull_timer_enabled: true
retention_timer_enabled: true

# The collector was qualified and staged independently of the host installer pin.
# Keep its existing v0.2.6 selection shared without upgrading other host consumers.
akasha_collector_version: host-v0.2.6
akasha_collector_script: "/opt/chaldea-host/releases/{{ akasha_collector_version }}/host/akasha-collector.mjs"
# The separate enrollment inventory has no agent_hosts group and keeps its defaults.
