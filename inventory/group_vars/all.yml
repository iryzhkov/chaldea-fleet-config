---
# Every host converges itself with ansible-pull, so every connection is local
# and modules run under the same Python as Ansible.
ansible_connection: local
ansible_python_interpreter: "{{ ansible_playbook_python }}"
fleet_home: "{{ ansible_facts.user_dir }}"

# Private repositories are read over SSH with a read-only deploy key per host
# and repository, each behind a Host alias in ~/.ssh/config. The play checks
# that the aliases exist; the keys and aliases are set up by hand. This
# repository's own URL is pull_timer_repo in roles/pull_timer.
agent_tools_homelab_cli_repo: git@github-homelab-cli:iryzhkov/homelab-cli.git

# Agent tools, each at an exact commit: none of them publishes releases yet.
agent_tools_sources:
  - name: homelab-cli
    repo: "{{ agent_tools_homelab_cli_repo }}"
    ref: eefa9f68f469bdb7e97554fee47b416c01fa765a
  - name: ov-memory
    repo: https://github.com/iryzhkov/ov-mcp.git
    ref: efac1c8f04662a3512da84aa6559a26061e97832

# Source-owned OpenCode plugin: exact public omarchy-setup bytes, verified via gh API.
agent_config_huyang_plugin_ref: ebec80bca66d684d6fe47c5c57c7cf212b6558b2
agent_config_huyang_plugin_sha256: e46883992727741758115492030f75bb26dbea14dccd3a4b4c3459cc5547f6c4

# Credentials are referenced by path only (relative to the home directory);
# the play checks that each file exists and is private, never reads it.
agent_tools_credential_files:
  - {name: Jocasta token, path: .config/jocasta/token}

# Chaldea runtime, independent of job toolchains; retention keeps this install.
chaldea_node_version: "26.10.0"

# Reviewed candidate; confirm the immutable public release tag before rollout.
chaldea_host_version: host-v0.1.0
chaldea_host_sha256: "f83769273ffe568c5748a0eccccf5a812d4f31c25be9e62ce00a9423ddc1d71e"

# Canonical access filesystem contract, consumed by host-role defaults/templates.
chaldea_access_paths:
  root: /etc/chaldea-access-trust
  state: /var/lib/chaldea-access-trust
  public: /var/lib/chaldea-access-trust-public
  run: /run/chaldea-access-trust
  bundle: /var/lib/chaldea-access-trust-public/bundle.jws
  clock_health: /run/chaldea-access-trust/clock-health.json
  updater_state: /var/lib/chaldea-access-trust/updater.sqlite
  verifier_state: /var/lib/akasha/access-state.db

# Fleet compute is explicitly enrolled per host after review; hosts.yml turns
# each role on. Only public halves of the job keys belong here, never a private
# key. Enrolled 2026-10-17: job hosts agent-a, agent-b, omarchy-pc and the
# laptop, session hosts omarchy-pc and the laptop. Targets are listed in Igor's
# fallback order: agent-a, agent-b, omarchy-pc (when its game gate allows), laptop. The laptop's address comes from DHCP on wlan0; if it
# changes, its from= restriction refuses it until this entry is updated.
# Trust and clock packaging is source-only; enroll verifiers explicitly after bootstrap.
chaldea_access_trust_enabled: false
chaldea_access_trust_anchors: []
chaldea_job_host_enabled: false
chaldea_job_client_enabled: false
chaldea_job_host_sources:
  - {name: omarchy-pc, ip: 192.168.90.212, public_key: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICTi+TR2Q70AdX2L40cVSEFichmJEVmkrCFUgSkH9ne5'}
  - {name: laptop, ip: 192.168.90.163, public_key: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPfzyHZ+qPdUaHXzwHyRXKGhvlPs/Fz+EoE0Jk57Mg8Z'}
chaldea_job_client_targets:
  - {name: agent-a, address: 192.168.130.2, port: 2222}
  - {name: agent-b, address: 192.168.130.3, port: 2222}
  - {name: omarchy-pc, address: 192.168.90.212, port: 2222}
  - {name: laptop, address: 192.168.90.163, port: 2222}

t3_enabled: true
t3_version: 0.1.0
# Set true for one run to move T3 to t3_version. t3 update restarts the
# service, which interrupts running sessions, so it never happens implicitly.
t3_allow_upgrade: false

# Both timers stay off until enabled per host after a reviewed check run.
pull_timer_enabled: false
retention_timer_enabled: false

# Reviewed release pins, generated once from the published sums (2026-10-17).
# Node: nodejs.org/dist/vVERSION/SHASUMS256.txt; Go: dl.google.com/go/*.sha256;
# uv: github.com/astral-sh/uv/releases/download/VERSION/*.sha256;
# Rust: static.rust-lang.org/dist/*.sha256. Updating versions requires pins.
chaldea_job_host_toolchain_versions:
  node: ["26.12.0"]
  go: ["1.27.0"]
  rust: ["1.99.0"]
  uv: ["0.12.10"]
