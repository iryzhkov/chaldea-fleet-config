---
# Candidate only. Root must qualify this exact source, protected staging,
# review and CI before merge. Ordinary pulls activate these selections.
# Laptop is accepted; this host still needs its own on-host native acceptance.
# Reuse installed protected sources after root's initial per-host delivery.
# OpenCode is excluded. Rollback must restore this host's prior entry absence.
webmcp_interactive_enabled: true
webmcp_interactive_laptop_qualified: true
webmcp_interactive_helper_source: /usr/local/libexec/webmcp-interactive-headers
# M3 P3.1 selector-aware helper, built from fleet e2bef1a with Go 1.27.0.
webmcp_interactive_helper_sha256: 8f091dc9579db25e2f58b62963e9330814da0ad28b9079dd7129603d20a333fc
# Rollback: legacy helper 667cd06e83a091d607306e6486ff079d0065038abf2db64b87234d15492bd6ed
# retained at /usr/local/libexec/webmcp-interactive-headers.legacy-667cd06e83a0 on agent-a.
chaldea_host_identity_enabled: true
webmcp_interactive_credential_source: "{{ fleet_home }}/.config/webmcp-interactive/enrollment.json"

mcp_registrations_jocasta_interactive_state: present
mcp_registrations_remote_servers:
  - name: jocasta
    state: "{{ mcp_registrations_jocasta_interactive_state }}"
    url: https://jocasta.mcp.ryzhkov.dev/mcp
    providers: [claude, codex]

agent_config_fleet_tools_profile:
  name: interactive-operator
  tools: {"*": [read, write]}
  mcp: "{{ ['ov-memory'] + (['jocasta'] if mcp_registrations_jocasta_interactive_state == 'present' else []) }}"
