---
# Accepted laptop managed Jocasta access. Claude and Codex use the fixed native
# helper; ordinary OpenCode 2.1.4 uses the separate fleet plugin after native
# ARM64/T3 read, write, CAS, idempotence, lifetime and rollback acceptance.
# Merging the OpenCode selection enables that consumer through ordinary pulls.
# The public OAuth definition below remains the disabled-managed-mode fallback
# for Claude and Codex. No identity, credential or other-service grant is added.
#
# Local pulls reuse the accepted installed artifacts. No controller staging path,
# credential value or private digest belongs in inventory. The role requires the
# enrollment's UID-owned 0700 parent and single-link 0600 file without symlinks.
# state: absent removes only the listed Jocasta registrations.
#
# Preserve the laptop runtime and retention selections from the retired tooling file.
chaldea_node_version: "26.12.0"
retention_mise_prune: false
webmcp_interactive_enabled: true
webmcp_interactive_opencode_state: present
webmcp_interactive_helper_source: /usr/local/libexec/webmcp-interactive-headers
webmcp_interactive_credential_source: "{{ fleet_home }}/.config/webmcp-interactive/enrollment.json"

# Full resource-document OV for ordinary Claude and Codex. Infra delivers the
# separate protected full credential before this selection can converge.
# The narrow selection is superseded; Claude/Codex stdio remains retired.
webmcp_interactive_ov_enabled: false
webmcp_interactive_ov_full_enabled: true
# HOLD MERGE: docs/ov-personal-client-activation.md. Shared helper source d6e08f41,
# Go1.27.0 Linux/ARM64 build 2bab960a-881d-469a-b186-417dec2233e8.
# Other hosts retain their architecture pins. Protected staging and the exact
# previous-pin guard are private rollout inputs, never inventory selections.
# Seed join superset source c04c798, Linux/ARM64 Chaldea build
# 3b4ed168-d126-4bd7-8613-664bd7cf8a96; installed REAL/repeat:
# jocasta:1bafe232420100bbca3f8a118a30878b@1.
# Single native canary: jocasta:b5c3380ab7e3ffdd8002e1d5615b1677@1.
# Existing torrent, janitor, TV/Anime, OV and Jocasta modes remain in the same
# reviewed binary.
# Shizune mode superset: source 760d3e7 (PR #165), Go 1.27.0 Linux/ARM64 Chaldea
# build 40204767-9cfd-4ce9-8df4-1521887afee9; previous installed 9086fa22.
# The same binary carries the three default-off holonet-acquire modes: 760d3e7
# contains PR #164, and main 98c1b74 rebuilds 9a9455ee byte for byte (Chaldea
# job 61982613-362c-45bd-b142-37cbbc68cbeb). It supersedes the pre-Shizune
# acquisition candidate 3490d4a7. No acquisition mode is selected here.
# Selector-aware helper from fleet main ae12133 (PR191: acquisition modes keep the
# original writer under host identity), Go 1.27.0, Chaldea job
# 1660b886-fbc6-4150-883b-9919a9ba044a; the same recipe reproduces 4417f939 from e2bef1a.
# HoloNet library mode: fleet main ac4819f (PR203), Go 1.27.0 Linux/ARM64 with the
# same recipe, Chaldea job 2753e515-a53e-47fb-b111-771a7f2c81e3; the recipe
# reproduces 268a4821 from ae12133 byte for byte (job 189237d2).
# Shizune budget write scope (PR208): fleet main 7b63585, Go 1.27.0 Linux/ARM64,
# same recipe, Chaldea job ea4a63aa-439e-49c7-a922-388ba6b29c73.
webmcp_interactive_helper_sha256: 736c06be435f748f4265728daf08789b6d4809c9d6fc221fe1d3583d17d31d5f
# Rollback: previous library-capable helper 1e8ff2e2 (ac4819f, PR203), retained at
# /usr/local/libexec/webmcp-interactive-headers.previous-1e8ff2e22d75 on the laptop.
# Rollback: previous helper 268a4821 (ae12133, PR191).
# Host-scoped capability pin for the selector-aware helper.
webmcp_interactive_host_identity_helper_checksums:
  aarch64: "736c06be435f748f4265728daf08789b6d4809c9d6fc221fe1d3583d17d31d5f"
# Rollback: previous selector-aware helper 4417f939 retained at
# /usr/local/libexec/webmcp-interactive-headers.previous-4417f939c2a2 on the laptop.
# Rollback: legacy helper 9a9455eeffe62f0287ebaa36fc7f0cd5024ef819722cb277b44dd3b5bf8694ad
# retained at /usr/local/libexec/webmcp-interactive-headers.legacy-9a9455eeffe6 on laptop.
chaldea_host_identity_enabled: true

mcp_registrations_jocasta_interactive_state: present

mcp_registrations_remote_servers:
  - name: jocasta
    state: "{{ mcp_registrations_jocasta_interactive_state }}"
    url: https://jocasta.mcp.ryzhkov.dev/mcp
    # Antigravity gets the closed stdio bridge to the same helper tuple.
    providers: [claude, codex, antigravity]
    # Exact redirect http://localhost:43182/callback.
    claude:
      oauth:
        clientId: jocasta-laptop-interactive
        callbackPort: 43182
        scopes: jocasta.read jocasta.write offline_access
    # The callback path is Codex's own suffix for this exact URL:
    # base64url of the first nine SHA-256 bytes of the canonical MCP URL. No
    # oauth_resource: discovery supplies the resource.
    codex:
      scopes: [jocasta.read, jocasta.write, offline_access]
      oauth:
        client_id: jocasta-laptop-interactive
        callback_port: 43181
        callback_url: http://127.0.0.1:43181/callback/bbdouGp56E53
    # Native OAuth stays off here; OpenCode uses the separate helper plugin.
    opencode:
      oauth:
        clientId: jocasta-laptop-interactive
        scope: jocasta.read jocasta.write offline_access
        callbackPort: 43183
        redirectUri: http://127.0.0.1:43183/callback
  # Providers only: the role fixes URL, helper mode and host for these two
  # managed entries, which still need their own enable flags.
  - name: ov
    providers: [claude, codex, antigravity]
  - name: shizune
    providers: [claude, codex, antigravity]

# The same interactive profile as the role default, plus the jocasta MCP
# guidance while the registration is present. Instruction filtering only.
agent_config_fleet_tools_profile:
  name: interactive-operator
  tools: {"*": [read, write]}
  mcp: "{{ ['ov-memory'] + (['ov'] if webmcp_interactive_ov_full_enabled | default(false) | bool else []) + (['jocasta'] if mcp_registrations_jocasta_interactive_state == 'present' else []) }}"
