# Ordinary laptop Movies catalog reader, independent of the limited preset.
# Codex initial access is released; the Claude consumer requires its own
# reviewed source, guarded rollout and native proof. Merges activate pulls.
# The issuer-delivered credential is metadata-checked only, never copied here.
webmcp_interactive_holonet_enabled: true
# Maintain the existing separate writer and its explicitly scoped playback
# grant. Merge only after guarded installation and native acceptance.
# Existing-account Movies-only janitor reads; no pause, hashing or removal.
# Native importer canary: jocasta:fc1242c4e71d8472b06dc36909db8ad8@1.
webmcp_interactive_holonet_janitor_enabled: true
# Separate Movies-only torrent reads; preserves the old janitor contract.
# One native canary: jocasta:d25b3ce108c2481234598ec3a9ae71a4@1.
webmcp_interactive_holonet_torrents_enabled: true
# Separate Movies-only stat-only seed join; linked is one instant, not removal.
# Approved packet jocasta:c61d194504ef8dd2318e1a1e3e1a5bfc@3; one native
# canary: jocasta:b5c3380ab7e3ffdd8002e1d5615b1677@1.
webmcp_interactive_holonet_seed_join_enabled: true
# Acquisition READ on the original writer only (inspect and search, no start or
# media). Issuer READ mapping and consumer READ config live since 2026-11-14:
# jocasta:39d9021b49ef3e92579a57a8ec0eaf61@336. Start and media stay off.
webmcp_interactive_holonet_acquire_read_enabled: true
webmcp_interactive_holonet_writer_enabled: true
