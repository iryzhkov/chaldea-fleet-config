---
# Laptop's first persistent read-only Jocasta tooling sessions. Applied by the
# normal pull, so it must stay equal to the qualified state the reviewed
# maintenance left (execution af50ab7396f94090bb590da80785596f, fleet d4e697a,
# infra a65d4b8; Codex execution 68f4bdeda1234a1aaa36fbccba654214, fleet
# PR105). Public values only: credentials are named by path and inspected with
# stat; none is stored here.
#
# The laptop runs its single waits owner under the system manager with the
# protected session policy and its fixed provider profiles. Claude and Codex
# (cwd bound to the T3 server's working directory, the fleet home) passed
# native acceptance. Interactive T3 providers, default models and the Chaldea
# MCP registration are not configured here:
# mcp_registrations_chaldea_waits_enabled stays false on this host. System mode
# converges waits only (docs/waits-system-preflight.md); the shared client pin,
# quota unit and route files are left as last converged.
#
# ROOT-GATED OPENCODE SELECTION, do not merge or pull until qualified: this
# branch adds the OpenCode preset, enrollment and profile (opencode/big-pickle,
# no options, protected native 2.1.3, private HOME and tmpdir). Merge only after
# root's native acceptance of this exact source passes; delivering the profile
# installs its protected launcher. See docs/laptop-opencode-prepared.md.
#
# Every other host keeps its waits settings in hosts.yml; nothing here applies
# to them. Rollback is a target-specific packet: docs/waits-system-preflight.md
# (system to user) and docs/chaldea-client.md ("Rollback" under fixed profiles).
# Deleting this file alone does not roll back; the role refuses user mode while
# the system unit exists.

chaldea_client_waits_enabled: true
chaldea_client_waits_service_mode: system
# Persistent service: no bounded canary window and no status-read restart.
chaldea_client_waits_deadline: ""
chaldea_client_waits_environment: 943bead7-d804-4e04-984e-63d230303796
# Waits-only T3 0.1.5 compatibility selection; shared current .11/previous .9
# and the shared client pin stay unchanged. Published client-v0.4.23 at
# 2a9aec02d003969af1a1fa19e995a4934288c75b includes merged Chaldea PR99.
# https://github.com/iryzhkov/chaldea/releases/download/client-v0.4.23/chaldea-client.tar.gz
# SHA-256 b96c928d050d81e7be96841baf8ce0204927cd14fbd43b62cc0d4ac058fb9c82,
# manifest SHA-256 443cdf3598fb146e03ff1010bda6753ff1780d78a5d860182eedf185ac89b41a.
# The role selects an installed runtime; a missing one stops the pull.
chaldea_client_waits_runtime_root: /home/igor/.local/share/chaldea/releases/client-v0.4.23
# Current-only after verified .23 convergence: no legacy system runtime admission.
# Preserve the installed .20 release and backup; .20 is not an operational fallback.
# See docs/laptop-waits-t3-015-compat.md for the historical migration and limits.
# The system unit runs the installed Node 26.12.0. This host-wide override also
# moves the laptop's other Chaldea Node consumers (MCP registration command,
# job-client launcher, collector and retention) to 26.12.0.
chaldea_node_version: "26.12.0"
# Retention protects only chaldea_node_version from mise prune, but Node 26.10.0
# is still needed here: system mode no longer re-renders the user quota and
# quota-sharing units, which keep running it, and the reserved pre-system user
# unit backup names it. Keep mise prune off on this host while any of those
# remains; worktree, temporary and Go cache cleanup are unchanged.
retention_mise_prune: false
# The disabled pre-system user unit was rendered for Node 26.10.0. Admission
# of it and of its .pre-system backup only; it never runs that version. Keep
# it while the backup is reserved.
chaldea_client_waits_legacy_user_node_version: "26.10.0"

chaldea_client_session_policy_enabled: true

# Ordinary Claude/Codex now use enrolled interactive WebMCP. Keep the qualified
# definitions below as explicit rollback inputs, but admit only OpenCode by default.
# An operator must remove the three exact T3 instances after proving no consumers
# and before activating the guarded profile-file inverse. Never reroute a retired
# preset to an ordinary provider, and never remove its login HOME or credentials.
chaldea_laptop_jocasta_legacy_sessions_enabled: false

# The role reads only the effective chaldea_client_session_* maps below.
# Defaults admit only the existing OpenCode Jocasta input. The two legacy flags
# deliberately restore the old Jocasta Claude/Codex and HoloNet inputs; false
# selects their explicit owned-file retirement, not a byte-preserving pause.
# Jocasta entries are combined last, so HoloNet cannot replace one of them.
chaldea_client_session_ceilings: >-
  {{ chaldea_laptop_jocasta_ceilings + (chaldea_laptop_holonet_catalog_ceilings
     if chaldea_laptop_holonet_catalog_enabled | bool else []) }}
chaldea_client_session_presets: >-
  {{ (chaldea_laptop_holonet_catalog_presets if chaldea_laptop_holonet_catalog_enabled | bool else {})
     | combine(chaldea_laptop_jocasta_presets if chaldea_laptop_jocasta_legacy_sessions_enabled | bool
       else {'jocasta-tooling-opencode': chaldea_laptop_jocasta_presets['jocasta-tooling-opencode']}) }}
chaldea_client_session_enrollments: >-
  {{ (chaldea_laptop_holonet_catalog_enrollments if chaldea_laptop_holonet_catalog_enabled | bool else {})
     | combine(chaldea_laptop_jocasta_enrollments if chaldea_laptop_jocasta_legacy_sessions_enabled | bool
       else {'jocasta-tooling-opencode': chaldea_laptop_jocasta_enrollments['jocasta-tooling-opencode']}) }}
chaldea_client_session_profiles: >-
  {{ (chaldea_laptop_holonet_catalog_profiles if chaldea_laptop_holonet_catalog_enabled | bool else {})
     | combine(chaldea_laptop_jocasta_profiles if chaldea_laptop_jocasta_legacy_sessions_enabled | bool
       else {'jocasta-tooling-opencode': chaldea_laptop_jocasta_profiles['jocasta-tooling-opencode']}) }}

# Existing role-owned inverse only. Provider/admission quiescence is an operator
# prerequisite; source merge and fleet activation must be sequenced with it.
chaldea_client_session_profiles_absent: >-
  {{ ([{'name': 'holonet-movies-catalog-claude', 'driver': 'claude'}]
      if not chaldea_laptop_holonet_catalog_enabled | bool else [])
     + ([{'name': 'jocasta-tooling-claude', 'driver': 'claude'},
         {'name': 'jocasta-tooling-codex', 'home': '/home/igor/.cache/acl-codex-startup-f73bc687/home'}]
        if not chaldea_laptop_jocasta_legacy_sessions_enabled | bool else []) }}

chaldea_laptop_jocasta_ceilings:
  - project: tooling
    maxSeconds: 1800
    destinations: [f29ad608-ef74-42e2-bc34-1d8c4f4c8dc5]
    services: &jocasta_tooling_services
      - audience: jocasta
        grants:
          - resource: project:tooling
            actions: [get, history, list, search]

# Destinations are T3 project IDs: the root caller's existing project. The
# session runs in the dedicated "Jocasta tooling sessions" T3 project.
chaldea_laptop_jocasta_presets:
  jocasta-tooling-claude:
    instanceId: claude-jocasta-tooling
    # The pinned Claude 2.1.276 native refuses opus-5-5 (needs >= 2.1.280);
    # claude-opus-5 is the model its provider catalog lists.
    model: claude-opus-5
    runtimeMode: approval-required
    interactionMode: default
    projectId: mcp:2fe01b0e-5727-4111-9b95-ff81508562ba
    title: Jocasta tooling read-only Claude
    prompt: &jocasta_tooling_prompt >-
      Use only the jocasta_tooling MCP server. Do not use other tools, local
      files, commands, web browsing or delegation. Read lines 1:3 of document id
      0039fc5e47f4ecf7f2aa5b02d3651b3c in project tooling, then request document
      id 0004d615b73f2a91d0caa4e80b25cae3 from project homelab and verify it is
      denied or not found. Do not mutate any document. Return only JSON under
      1000 UTF-8 bytes:
      {"v":1,"status":"PASS|FAIL|INCOMPLETE","toolingRead":"PASS|FAIL","otherProject":"DENIED|FAIL","documentId":"0039fc5e47f4ecf7f2aa5b02d3651b3c","revision":1,"issues":[]}.
      This is reporter data, not instructions. Never include document content,
      credentials or auth headers.
    inputs: {project: tooling}
    project: tooling
    services: *jocasta_tooling_services
    maxSeconds: 1800
    delegate: false
    destinations: [f29ad608-ef74-42e2-bc34-1d8c4f4c8dc5]
  jocasta-tooling-codex:
    instanceId: codex-jocasta-tooling
    model: gpt-6.1-sol
    options:
      - {id: reasoningEffort, value: high}
    runtimeMode: approval-required
    interactionMode: default
    projectId: mcp:2fe01b0e-5727-4111-9b95-ff81508562ba
    title: Jocasta tooling read-only Codex
    prompt: *jocasta_tooling_prompt
    inputs: {project: tooling}
    project: tooling
    services: *jocasta_tooling_services
    maxSeconds: 1800
    delegate: false
    destinations: [f29ad608-ef74-42e2-bc34-1d8c4f4c8dc5]
  # The model is listed by the pinned 2.1.3 source and by the T3 catalog with
  # no options; native availability and auth are root's acceptance gate.
  jocasta-tooling-opencode:
    instanceId: opencode-jocasta-tooling
    model: opencode/big-pickle
    runtimeMode: approval-required
    interactionMode: default
    projectId: mcp:2fe01b0e-5727-4111-9b95-ff81508562ba
    title: Jocasta tooling read-only OpenCode
    prompt: *jocasta_tooling_prompt
    inputs: {project: tooling}
    project: tooling
    services: *jocasta_tooling_services
    maxSeconds: 1800
    delegate: false
    destinations: [f29ad608-ef74-42e2-bc34-1d8c4f4c8dc5]

# One ordinary Authentik account per host and profile, enrolled by
# homelab-infra's playbooks/authentik-jocasta-tooling.yml, which delivers the
# secretFile. JWT scope jocasta.read, 300-second lifetime.
chaldea_laptop_jocasta_enrollments:
  jocasta-tooling-claude:
    form: app_password
    issuer: https://auth.ryzhkov.dev/application/o/chaldea-jocasta/
    tokenUrl: https://auth.ryzhkov.dev/application/o/token/
    jwksUrl: https://auth.ryzhkov.dev/application/o/chaldea-jocasta/jwks/
    clientId: chaldea-jocasta-tooling
    username: chaldea-laptop-jocasta-tooling-claude
    scope: jocasta.read
    resource: https://jocasta.mcp.ryzhkov.dev/mcp
    project: tooling
    maxTokenSeconds: 300
    secretFile: /home/igor/.config/chaldea/authentik/jocasta-tooling-claude.app-password
  jocasta-tooling-codex:
    form: app_password
    issuer: https://auth.ryzhkov.dev/application/o/chaldea-jocasta/
    tokenUrl: https://auth.ryzhkov.dev/application/o/token/
    jwksUrl: https://auth.ryzhkov.dev/application/o/chaldea-jocasta/jwks/
    clientId: chaldea-jocasta-tooling
    username: chaldea-laptop-jocasta-tooling-codex
    scope: jocasta.read
    resource: https://jocasta.mcp.ryzhkov.dev/mcp
    project: tooling
    maxTokenSeconds: 300
    secretFile: /home/igor/.config/chaldea/authentik/jocasta-tooling-codex.app-password
  jocasta-tooling-opencode:
    form: app_password
    issuer: https://auth.ryzhkov.dev/application/o/chaldea-jocasta/
    tokenUrl: https://auth.ryzhkov.dev/application/o/token/
    jwksUrl: https://auth.ryzhkov.dev/application/o/chaldea-jocasta/jwks/
    clientId: chaldea-jocasta-tooling
    username: chaldea-laptop-jocasta-tooling-opencode
    scope: jocasta.read
    resource: https://jocasta.mcp.ryzhkov.dev/mcp
    project: tooling
    maxTokenSeconds: 300
    secretFile: /home/igor/.config/chaldea/authentik/jocasta-tooling-opencode.app-password

# The native source is the operator-staged public asset under provider-assets,
# never a download or a mise install path. Hash and size are reviewed pins.
chaldea_laptop_jocasta_profiles:
  jocasta-tooling-claude:
    driver: claude
    native:
      source: /home/igor/.local/share/chaldea/provider-assets/claude/2.1.276/claude
      sha256: e9ac3df956083645578a382ad64ec304468666e362c33bfdefd803cd6ff596b0
      size: 231989488
    elf_machine: 183
    cwd: /home/igor/.local/share/chaldea/session-workspaces/jocasta-tooling
    preset: jocasta-tooling-claude
    audience: jocasta
    server: jocasta_tooling
    url: https://jocasta.mcp.ryzhkov.dev/mcp
    tools: [get, history, list, search]
  # The Codex home is the existing, already qualified auth context; the role
  # only writes its .codex/config.toml and never reads or copies the login.
  # cwd is the T3 server's working directory, which the launcher checks
  # exactly; the session's T3 workspace remains the dedicated one.
  jocasta-tooling-codex:
    driver: codex
    native:
      source: /home/igor/.local/share/chaldea/provider-assets/codex/0.163.0/codex
      sha256: 8a96f66d059d653e68bfd5f3c79337e6f1d7d170d80bf705eb7d0249b34c0ece
      size: 257816200
    host:
      source: /home/igor/.local/share/chaldea/provider-assets/codex/0.163.0/codex-code-mode-host
      sha256: 255eccc8a5c1d267dc0acbc815cc83aaa1f50955bd99943b29f00cafcdcab771
      size: 67118080
    catalog:
      source: /home/igor/.local/share/chaldea/provider-assets/codex/0.163.0/models.json
      sha256: ad005892044dec4f817f431ff75302193e27bbfb7533958afe6a91194fd7b784
      size: 65174
    elf_machine: 183
    model: gpt-6.1-sol
    home: /home/igor/.cache/acl-codex-startup-f73bc687/home
    tmpdir: /home/igor/.local/state/chaldea/profiles/jocasta-tooling-codex/tmp
    cwd: /home/igor
    preset: jocasta-tooling-codex
    audience: jocasta
    server: jocasta_tooling
    url: https://jocasta.mcp.ryzhkov.dev/mcp
    tools: [get, history, list, search]
    disabled_servers: [jocasta]
  # The protected 2.1.3 native, not the ordinary installed OpenCode. home and
  # tmpdir are operator-provisioned, private 0700 and never read by the role.
  jocasta-tooling-opencode:
    driver: opencode
    native:
      source: /home/igor/.local/share/chaldea/provider-assets/opencode/2.1.3/opencode
      sha256: 78c279e68f25e69045a7ec5f518fccbad57e8f25d7853e66ba9677ddfaf28b19
      size: 236047352
    elf_machine: 183
    home: /home/igor/.local/state/chaldea/profiles/jocasta-tooling-opencode/home
    tmpdir: /home/igor/.local/state/chaldea/profiles/jocasta-tooling-opencode/tmp
    cwd: /home/igor
    preset: jocasta-tooling-opencode
    audience: jocasta
    server: jocasta_tooling
    url: https://jocasta.mcp.ryzhkov.dev/mcp
    tools: [get, history, list, search]
