---
# Qualified client and protected reader canary, omarchy-pc only.
# Client-v0.4.30 from Chaldea main 672fdf3; release assets verified by download.
chaldea_client_version: client-v0.4.30
chaldea_client_sha256: 21f8f650d43f7109e1fc0b31319f88911f9740360aecc5c1c8e202bf2d7af279
chaldea_client_route_targets:
  scores:
    enabled: true
    url: https://akasha.ryzhkov.dev
    tokenHelper: /usr/local/bin/chaldea-token-helper
    host: omarchy-pc
  # This canary has read permission only. Homelab publishes snapshots.
  announceHost: homelab
  pins: {}
  # Stopgap from 2026-11-22: Antigravity weekly usage ran ahead of pace while
  # Codex was under-paced, and the static order ignores pacing. Codex and
  # Claude rank first until the client gains pace-aware provider preference;
  # quota stops, capacity, floors, bans and review separation still apply.
  providerPreference: [codex, claudeAgent, antigravity]
  # Setting bans replaces the default, so keep *sonnet*. The Gemini bans leave
  # Gemini 4 Neon as the only Antigravity Gemini pick; orchestrators and
  # gpt-oss have no usable AA rows.
  bans:
    - "*sonnet*"
    - "gemini-pro-orchestrator-*"
    - "gpt-oss-*"
    - "gemini-4-hydrogen*"
    - "gemini-4-argon*"
    - "gemini-3.8-flash*"
  benchmark:
    indexVersion: "5"
    anchors:
      bulk-read: [gpt-6.1-sol, claude-opus-5-5]
      critical-review: [gpt-6.1-sol, claude-opus-5-5]
