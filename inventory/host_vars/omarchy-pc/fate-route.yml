---
# Qualified client and protected reader canary, omarchy-pc only.
# Client-v0.4.35 from Chaldea main 27d94dc; release assets verified by download.
chaldea_client_version: client-v0.4.35
chaldea_client_sha256: f58d2956814ab491ca22ffe25c9f0cec10d23551855c570799bfa927c7b147ca
chaldea_client_route_targets:
  scores:
    enabled: true
    url: https://akasha.ryzhkov.dev
    tokenHelper: /usr/local/bin/chaldea-token-helper
    host: omarchy-pc
  # This canary has read permission only. Homelab publishes snapshots.
  announceHost: homelab
  pins: {}
  # No providerPreference: quota pacing chooses between Codex and Claude, and
  # Antigravity ranks after both as a fallback. A fixed order only demotes a
  # provider that is ahead of pace and never promotes an under-used one, so
  # with Codex first Claude's weekly quota went unused (2026-11-22).
  # Builder floor lowered from 50 to 48 (2026-11-22, Igor's decision) so
  # Claude Opus 5.5 at medium effort (AA intelligence 48.2, about $2.45 per
  # benchmark task) qualifies ahead of Fable 5.2 at low effort (53.9, $3.10).
  # Every other role keeps the client default floor.
  floors:
    builder: 48
  # Antigravity is never used for bulk reading; targeted reviews may use it.
  roleProviderExclusions:
    bulk-read: [antigravity]
  # Antigravity routes only Gemini 4 Neon. Its third-party Claude and GPT
  # models are not routed; Claude work goes through the claudeAgent provider.
  driverModels:
    antigravity: [gemini-4-neon]
  # Setting bans replaces the default, so keep *sonnet*. The Gemini bans leave
  # Gemini 4 Neon as the only Antigravity Gemini pick; orchestrators and
  # gpt-oss have no usable AA rows.
  bans:
    - "*sonnet*"
    - "gemini-pro-orchestrator-*"
    - "gpt-oss-*"
    - "gemini-4-hydrogen*"
    - "gemini-4-argon*"
    - "gemini-3.8-flash*"
  benchmark:
    indexVersion: "5"
    anchors:
      bulk-read: [gpt-6.1-sol, claude-opus-5-5]
      critical-review: [gpt-6.1-sol, claude-opus-5-5]
