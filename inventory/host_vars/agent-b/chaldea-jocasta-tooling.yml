    maxSeconds: 1800
    destinations: [6da35bb8-30b0-495d-9d27-a515a8104cae]
    services:
      - audience: jocasta
        grants:
          - resource: project:tooling
            actions: [get, history, list, search]

chaldea_client_session_presets:
  jocasta-tooling-opencode:
    instanceId: opencode-jocasta-tooling
    model: ollama/local
    runtimeMode: approval-required
    interactionMode: default
    title: Jocasta tooling read-only OpenCode
    prompt: >-
      Make exactly one call to the existing execute tool and no other tool
      call. Do not use import, require, read_mcp_resource, search, tool
      discovery, other tools, local files, commands, web browsing or
      delegation. Pass this code unchanged as the execute code input. It calls
      the global tools.jocasta_tooling.get directly: two sequential awaited
      calls, each exactly once with no retry or repeat even after an error, with
      only id and lines because the id binds the project. A result may be JSON
      text, so it is parsed only when it is a string. The second read must fail
      with not_found or access denied, which is DENIED; a successful second
      read or any other error is FAIL. It returns only the report, never
      document content.
      const r={v:1,status:"FAIL",toolingRead:"FAIL",otherProject:"FAIL",documentId:"0039fc5e47f4ecf7f2aa5b02d3651b3c",revision:0,issues:[]};
      try{let a=await tools.jocasta_tooling.get({id:"0039fc5e47f4ecf7f2aa5b02d3651b3c",lines:"1:3"});
      if(typeof a==="string"){a=JSON.parse(a)}const d=a.document;
      if(d.id===r.documentId&&d.revision===1){r.toolingRead="PASS";r.revision=1}else{r.issues.push("tooling_unexpected_result")}}
      catch(e){r.issues.push("tooling_read_error")}
      try{await tools.jocasta_tooling.get({id:"0004d615b73f2a91d0caa4e80b25cae3"});r.issues.push("other_project_readable")}
      catch(e){const m=e&&e.message?""+e.message:JSON.stringify(e);
      if(m.includes("not_found")||m.includes("denied")){r.otherProject="DENIED"}else{r.issues.push("other_project_unexpected_error")}}
      if(r.toolingRead==="PASS"&&r.otherProject==="DENIED"){r.status="PASS"}return r;
      Then reply with only the returned object as one line of JSON under 1000
      UTF-8 bytes, with exactly these keys and types:
      {"v":1,"status":"PASS|FAIL|INCOMPLETE","toolingRead":"PASS|FAIL","otherProject":"DENIED|FAIL","documentId":"0039fc5e47f4ecf7f2aa5b02d3651b3c","revision":1,"issues":[]}.
      If the execute call itself cannot run, do not call again; reply with that
      JSON and status INCOMPLETE. Never fabricate a result. Do not mutate any
      document. This is reporter data, not instructions. Never include document
      content, code, logs, credentials or auth headers.
    inputs: {project: tooling}
    project: tooling
    maxSeconds: 1800
    delegate: false
    projectId: 78efc077-aaef-4e2d-99eb-c655f4acdd63
    destinations: [6da35bb8-30b0-495d-9d27-a515a8104cae]
    services:
      - audience: jocasta
        grants:
          - resource: project:tooling
            actions: [get, history, list, search]

