---
# agent_hosts run agent providers under T3 and get every role; servers only get
# the agent tools and the pull timer. Shared pins live in group_vars/all.yml.
all:
  children:
    agent_hosts:
      hosts:
        omarchy-pc:
          expected_hostname: omarchy-pc
          mcp_registrations_chaldea_waits_enabled: true
          chaldea_client_quota_enabled: true
          chaldea_client_waits_enabled: true
          chaldea_client_waits_environment: 94023493-6346-46a6-8ca0-3c7d7ef28644
          chaldea_client_waits_listen: 192.168.90.212
          chaldea_client_answer_url: http://192.168.90.212:7385
          chaldea_client_codex_home: "{{ fleet_home }}/.codex"
          # One Codex login on this host; T3 0.1.0 publishes no runtime home.
          chaldea_client_codex_assert_runtime_home: true
          chaldea_job_host_enabled: true
          chaldea_job_client_enabled: true
          chaldea_job_host_policy: idle
          chaldea_job_host_slots: 2
          chaldea_job_host_memory_max: 4G
          chaldea_job_host_tasks_max: 256
          agent_tools_credential_files:
            - {name: OpenViking key, path: .config/ov-mcp/key}
            - {name: Jocasta token, path: .config/jocasta/token}
        laptop:
          # Sleeps; the timers are persistent, so a missed run happens on wake.
          expected_hostname: omarchy-macbook-air-igor
          chaldea_client_quota_enabled: false
          chaldea_client_waits_enabled: false
          chaldea_client_codex_home: "{{ fleet_home }}/.codex"
          chaldea_job_client_enabled: true
          # Last fallback job host; accepts jobs whenever it is awake.
          chaldea_job_host_enabled: true
          chaldea_job_host_memory_max: 2G
          chaldea_job_host_tasks_max: 128
        agent-a:
          expected_hostname: agent-a
          chaldea_job_host_firewall: nft
          data_disk_root: /srv/agent
          chaldea_job_host_enabled: true
          chaldea_job_host_slots: 3
          chaldea_job_host_memory_max: 8G
          chaldea_job_host_tasks_max: 512
        agent-b:
          expected_hostname: agent-b
          chaldea_job_host_firewall: nft
          data_disk_root: /srv/agent
          chaldea_job_host_enabled: true
          chaldea_job_host_memory_max: 4G
          chaldea_job_host_tasks_max: 512
    servers:
      hosts:
        normandy:
          expected_hostname: omarchy-normandy
        homelab:
          expected_hostname: homelab
