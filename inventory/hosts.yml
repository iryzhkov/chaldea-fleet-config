---
# agent_hosts run agent providers under T3 and get every role; servers only get
# the agent tools and the pull timer. Shared pins live in group_vars/all/main.yml.
all:
  children:
    agent_hosts:
      hosts:
        omarchy-pc:
          huyang_enabled: false
          huyang_memory_high: 2G
          expected_hostname: omarchy-pc
          akasha_collector_enabled: true
          akasha_collector_url: https://akasha.ryzhkov.dev
          akasha_collector_token_helper: /usr/local/bin/chaldea-token-helper
          # Shared022 keeps selected022 + every actual old release explicitly
          # (021/024/026/027/028/029; 023 is absent), with staged0210 as newest
          # prior. Fresh directory/mtime evidence gates each installer call.
          # Absent versions are never installed.
          chaldea_host_artifact_preserve_versions: [host-v0.2.1, host-v0.2.4, host-v0.2.6, host-v0.2.7, host-v0.2.8, host-v0.2.9]
          chaldea_client_quota_enabled: true
          chaldea_client_codex_home: "{{ fleet_home }}/.codex"
          # One Codex login on this host; T3 0.1.0 publishes no runtime home.
          chaldea_client_codex_assert_runtime_home: true
          # Native T3 quota verified after the approved normal-login repair.
          # Keep the redundant env-token collector off; preserve its private file.
          chaldea_client_claude_usage_enabled: false
          chaldea_client_claude_usage_source: {}
          chaldea_client_claude_contexts: []
          chaldea_client_analytics_max_age_ms: 7776000000
          # Qualified FATE reader settings are in host_vars/omarchy-pc/fate-route.yml.
          chaldea_job_host_enabled: true
          chaldea_job_client_enabled: true
          # Only `chaldea exec` runs the admitted blob-capable controller; every
          # other command keeps the pinned client. docs/chaldea-client.md.
          chaldea_job_client_exec_entry: /home/igor/.local/lib/chaldea-blob-controller/4f57cc27fa5a08da15233b018cf773c08a07291f/client-1e86175cd2ef2e11fdf4584d22cc73127a162d42/bin/chaldea
          chaldea_job_client_exec_node: /home/igor/.local/lib/chaldea-blob-controller/4f57cc27fa5a08da15233b018cf773c08a07291f/node-26.10.0
          chaldea_job_host_policy: idle
          chaldea_job_host_slots: 2
          chaldea_job_host_memory_max: 4G
          chaldea_job_host_tasks_max: 256
          agent_tools_credential_files:
            - {name: OpenViking key, path: .config/ov-mcp/key}
            - {name: Jocasta token, path: .config/jocasta/token}
        laptop:
          chaldea_client_quota_enabled: true
          chaldea_client_codex_home: "{{ fleet_home }}/.codex"
          chaldea_client_codex_assert_runtime_home: true
          # Native T3 quota owns usage collection and normal credential renewal.
          chaldea_client_claude_usage_enabled: false
          chaldea_client_claude_usage_source: {}
          chaldea_client_claude_contexts: []
          huyang_enabled: false
          huyang_memory_high: 1G
          # Sleeps; the timers are persistent, so a missed run happens on wake.
          expected_hostname: omarchy-macbook-air-igor
          chaldea_host_artifact_preserve_versions: [host-v0.1.1, host-v0.2.6, host-v0.2.7, host-v0.2.8, host-v0.2.9]
          akasha_collector_enabled: true
          akasha_collector_url: https://akasha.ryzhkov.dev
          akasha_collector_token_helper: /usr/local/bin/chaldea-token-helper
          chaldea_job_client_enabled: true
          # Last fallback job host; accepts jobs whenever it is awake.
          chaldea_job_host_enabled: true
          chaldea_job_host_memory_max: 2G
          chaldea_job_host_tasks_max: 128
        agent-a:
          chaldea_client_quota_enabled: true
          chaldea_client_codex_home: "{{ fleet_home }}/.codex"
          chaldea_client_codex_assert_runtime_home: true
          # Native T3 quota owns usage collection and normal credential renewal.
          chaldea_client_claude_usage_enabled: false
          chaldea_client_claude_usage_source: {}
          chaldea_client_claude_contexts: []
          huyang_enabled: false
          huyang_memory_high: 4G
          expected_hostname: agent-a
          chaldea_host_artifact_preserve_versions: [host-v0.2.4, host-v0.2.6, host-v0.2.7, host-v0.2.8, host-v0.2.9]
          akasha_collector_enabled: true
          akasha_collector_url: https://akasha.ryzhkov.dev
          akasha_collector_token_helper: /usr/local/bin/chaldea-token-helper
          # Activation PR: merge only after host-v0.2.1 pin and manual verification.
          chaldea_access_trust_enabled: true
          chaldea_job_host_firewall: nft
          data_disk_root: /srv/agent
          chaldea_job_host_enabled: true
          chaldea_job_host_slots: 3
          chaldea_job_host_memory_max: 8G
          chaldea_job_host_tasks_max: 512
        agent-b:
          chaldea_client_quota_enabled: true
          chaldea_client_codex_home: "{{ fleet_home }}/.codex"
          chaldea_client_codex_assert_runtime_home: true
          # Native T3 quota owns usage collection and normal credential renewal.
          chaldea_client_claude_usage_enabled: false
          chaldea_client_claude_usage_source: {}
          chaldea_client_claude_contexts: []
          huyang_enabled: false
          huyang_memory_high: 2G
          expected_hostname: agent-b
          chaldea_host_artifact_preserve_versions: [host-v0.2.1, host-v0.2.6, host-v0.2.7, host-v0.2.8, host-v0.2.9]
          akasha_collector_enabled: true
          akasha_collector_url: https://akasha.ryzhkov.dev
          akasha_collector_token_helper: /usr/local/bin/chaldea-token-helper
          chaldea_job_host_firewall: nft
          data_disk_root: /srv/agent
          chaldea_job_host_enabled: true
          chaldea_job_host_memory_max: 4G
          chaldea_job_host_tasks_max: 512
    servers:
      hosts:
        normandy:
          expected_hostname: omarchy-normandy
          # The trust publisher (homelab-infra roles/chaldea_publisher) runs
          # access-maintenance.mjs from the release pinned in homelab-infra
          # vars/chaldea-runtime.yml. Release GC removed its previous pin on
          # 2026-11-12 and stopped publication; keep this list equal to that pin.
          chaldea_host_artifact_preserve_versions: [host-v0.2.2]
          akasha_collector_enabled: true
          akasha_collector_url: https://akasha.ryzhkov.dev
          akasha_collector_token_helper: /usr/local/bin/chaldea-token-helper
          akasha_collector_node: /opt/chaldea/node/bin/node
          # These existing producers have feed grants, not fleet job_finished grants.
          akasha_collector_timer_events: false
        homelab:
          expected_hostname: homelab
          akasha_collector_enabled: true
          akasha_collector_url: https://akasha.ryzhkov.dev
          akasha_collector_token_helper: /usr/local/bin/chaldea-token-helper
          akasha_collector_node: /opt/chaldea/node/bin/node
          # These existing producers have feed grants, not fleet job_finished grants.
          akasha_collector_timer_events: false
          # The separate shared022 installer must retain all ten prior releases.
          chaldea_host_artifact_preserve_versions: [host-v0.2.3, host-v0.2.4, host-v0.2.6, host-v0.2.7, host-v0.2.8, host-v0.2.9, host-v0.2.10, host-v0.2.14]
