---
- name: Install the pinned host runtime artifact
  ansible.builtin.include_role:
    name: chaldea_host_artifact
    public: true

- name: Install timer outcome reporting
  ansible.builtin.include_role:
    name: timer_reporting

- name: Install the retention script
  become: "{{ chaldea_host_artifact_become }}"
  ansible.builtin.copy:
    src: "{{ chaldea_host_artifact_root }}/chaldea-retention"
    remote_src: true
    dest: "{{ retention_script }}"
    owner: "{{ chaldea_host_artifact_owner }}"
    group: "{{ chaldea_host_artifact_group }}"
    mode: "0755"
  when: chaldea_host_artifact_ready | bool

- name: Render the retention units
  ansible.builtin.set_fact:
    retention_service_unit: "{{ lookup('ansible.builtin.template', 'chaldea-retention.service.j2') }}"
    retention_timer_unit: "{{ lookup('ansible.builtin.template', 'chaldea-retention.timer.j2') }}"

- name: Install the retention timer
  ansible.builtin.include_role:
    name: user_timer
  vars:
    user_timer_name: chaldea-retention
    user_timer_service: "{{ retention_service_unit }}"
    user_timer_timer: "{{ retention_timer_unit }}"
    user_timer_enabled: "{{ retention_timer_enabled }}"
    user_timer_aux_changed: "{{ timer_reporting_units_changed }}"
