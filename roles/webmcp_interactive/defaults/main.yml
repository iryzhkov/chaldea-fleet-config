---
# Capability only. Root activates each host after protected enrollment.
webmcp_interactive_enabled: false
webmcp_interactive_laptop_qualified: false
webmcp_interactive_helper_source: ""
webmcp_interactive_helper_sha256: ""
webmcp_interactive_previous_helper_sha256: ""
webmcp_interactive_credential_source: ""
# Previous delivery SHA256 is private input for an owned rotation; never shown.
webmcp_interactive_previous_credential_sha256: ""
# Separate laptop-only OV capability for ordinary Codex. Off. Root enables it
# in laptop inventory only after homelab-infra has delivered the separate
# interactive OV credential and the reviewed helper with the OV mode is
# installed. Fleet never reads or delivers that credential; it only checks its
# custody before registering the fixed helper.
webmcp_interactive_ov_enabled: false
# Separate ordinary Movies catalog reader on laptop Codex; never the limited
# session credential. Infra delivers holonet-interactive.app-password first.
webmcp_interactive_holonet_enabled: false
# Independent writer capability; no inventory opts in. The root-owned public
# policy supplies the exact cohort and never contains a password or token.
webmcp_interactive_holonet_writer_enabled: false
webmcp_interactive_holonet_writer_targets: []
webmcp_interactive_holonet_writer_previous_policy_sha256: ""
# Full interactive OV for ordinary Claude and Codex on laptop and omarchy-pc:
# the helper's "ov-full HOST" mode with homelab-infra's separately delivered
# ov-full-interactive credential (docs/managed-interactive-webmcp.md, "Full
# interactive OV"). Off. It replaces the narrow selection above, never joins
# it, and needs a reviewed helper pin with that mode before any host opts in.
webmcp_interactive_ov_full_enabled: false
# Ordinary OpenCode consumer of the same full Jocasta helper. Empty: the role
# never touches OpenCode. present (with webmcp_interactive_enabled) installs the
# one fleet-owned plugin; absent removes only that marked file. Laptop inventory
# selects it after native qualification; additional hosts stay unset. See
# docs/opencode-interactive-jocasta.md.
webmcp_interactive_opencode_state: ""
