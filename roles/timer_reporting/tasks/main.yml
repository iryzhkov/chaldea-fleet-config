---
- name: Install the pinned host runtime artifact
  ansible.builtin.include_role:
    name: chaldea_host_artifact
    public: true

- name: Install the disabled-by-default host event collector
  ansible.builtin.include_role:
    name: akasha_collector

- name: Create the timer reporting directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ fleet_home }}/.local/bin"
    - "{{ fleet_home }}/.local/share/chaldea/timer-reporting"
    - "{{ fleet_home }}/.config/systemd/user"
    - "{{ fleet_home }}/.config/chaldea"

- name: Configure timer outcome delivery
  ansible.builtin.copy:
    content: "{{ {'delivery': 'queue' if akasha_collector_enabled | default(false) | bool else 'feed'} | to_json }}\n"
    dest: "{{ fleet_home }}/.config/chaldea/timer-reporting.json"
    mode: "0644"

- name: Install the timer outcome wrapper
  become: "{{ chaldea_host_artifact_become }}"
  ansible.builtin.copy:
    src: "{{ chaldea_host_artifact_root }}/chaldea-timer-report"
    remote_src: true
    dest: "{{ fleet_home }}/.local/bin/chaldea-timer-report"
    owner: "{{ chaldea_host_artifact_owner }}"
    group: "{{ chaldea_host_artifact_group }}"
    mode: "0755"
  when: chaldea_host_artifact_ready | bool

- name: Install the safe Ansible callback
  become: "{{ chaldea_host_artifact_become }}"
  ansible.builtin.copy:
    src: "{{ chaldea_host_artifact_root }}/chaldea_outcome.py"
    remote_src: true
    dest: "{{ fleet_home }}/.local/share/chaldea/timer-reporting/chaldea_outcome.py"
    owner: "{{ chaldea_host_artifact_owner }}"
    group: "{{ chaldea_host_artifact_group }}"
    mode: "0644"
  when: chaldea_host_artifact_ready | bool

- name: Install the timer failure handler
  ansible.builtin.copy:
    content: |
      # Managed by chaldea-fleet-config (roles/timer_reporting).
      [Unit]
      Description=Record a failed Chaldea timer invocation for %i
      [Service]
      Type=oneshot
      Environment=PATH=%h/.local/bin:/usr/local/bin:/usr/bin:/bin
      ExecStart=%h/.local/bin/chaldea-timer-report failure --job %i
      TimeoutStartSec=30s
    dest: "{{ fleet_home }}/.config/systemd/user/chaldea-timer-failure@.service"
    mode: "0644"
  register: timer_reporting_failure_unit

# Both timer roles include this role. Preserve a change seen by the first
# include so an enabled second timer reloads even if the first stays disabled.
- name: Remember changed reporting units for this convergence
  ansible.builtin.set_fact:
    timer_reporting_units_changed: "{{ timer_reporting_units_changed | default(false) | bool or timer_reporting_failure_unit is changed }}"
