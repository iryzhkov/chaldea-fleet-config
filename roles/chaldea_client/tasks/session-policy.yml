---
# The protected session policy Chaldea's wait service reads: public
# configuration, never a credential. Every check runs before the first write.
# The client parses the file again at every start; these checks only refuse
# what it would refuse, earlier and with the inventory field named.

- name: Refuse incompatible policy mode even through the role-only policy entrypoint
  ansible.builtin.import_tasks: waits-validate.yml

- name: Validate the session policy shape
  ansible.builtin.assert:
    that:
      - chaldea_client_waits_enabled | bool
      - chaldea_client_waits_environment | length > 0
      - chaldea_client_session_policy_path is regex('^/([A-Za-z0-9._-]+/)*policy[.]json$', match_type='fullmatch')
      - chaldea_client_session_policy_path | normpath == chaldea_client_session_policy_path
      - chaldea_client_session_policy_root == '/' or chaldea_client_session_policy_path.startswith(chaldea_client_session_policy_root ~ '/')
      - chaldea_client_session_ceilings | type_debug == 'list'
      - chaldea_client_session_ceilings | length >= 1
      - chaldea_client_session_ceilings | length <= 8
      - chaldea_client_session_presets is mapping
      - chaldea_client_session_presets | length >= 1
      - chaldea_client_session_presets | length <= 16
      - chaldea_client_session_enrollments is mapping
      - chaldea_client_session_enrollments.keys() | difference(chaldea_client_session_presets.keys()) | length == 0
    fail_msg: >-
      A session policy needs waits enabled with its environment, 1..8 ceilings, 1..16 presets,
      and enrollments only for declared presets.
    quiet: true

- name: Require fixed presets that never delegate
  ansible.builtin.assert:
    that:
      - item.key is regex('^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$', match_type='fullmatch')
      - item.value is mapping
      - item.value.keys() | difference(chaldea_client_session_preset_keys + ['options', 'inputs']) | length == 0
      - chaldea_client_session_preset_keys | difference(item.value.keys()) | length == 0
      - item.value.delegate is sameas false
    fail_msg: "Preset {{ item.key }} needs exactly the policy's preset fields and delegate: false."
    quiet: true
  loop: "{{ chaldea_client_session_presets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    chaldea_client_session_preset_keys: [instanceId, model, runtimeMode, interactionMode, projectId, title, prompt,
                                         project, services, maxSeconds, delegate, destinations]

# Public validation precedes private-file stat and every policy write.
- name: Require each enrollment to match its preset and the supported form
  ansible.builtin.assert:
    that:
      - >-
        chaldea_client_session_enrollments | chaldea_session_enrollments(
          chaldea_client_session_presets, chaldea_client_session_ceilings, fleet_home)
    fail_msg: Enrollment must match the closed service contract.
    quiet: true

- name: Refuse a rendered policy larger than the client can load
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.template', 'policy.json.j2') | chaldea_session_policy_size
    fail_msg: The rendered session policy must fit the client policy-load limit of 64 KiB.
    quiet: true

- name: Inspect operator-provisioned app passwords without reading them
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop: >-
    {{ (chaldea_client_session_enrollments | dict2items | map(attribute='value.secretFile') | list)
       + ([fleet_home ~ '/.config/chaldea/authentik'] if chaldea_client_session_enrollments | length > 0 else []) }}
  register: chaldea_client_enrollment_files

- name: Refuse unsafe app passwords and their directory
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - item.stat.uid | default(-1) == ansible_facts.user_uid | int
      - item.stat.mode | default('7777') is regex('^0[0-7]00$')
      - (item.stat.isdir | default(false)) if item.item.endswith('/authentik') else
        (item.stat.isreg | default(false) and (item.stat.nlink | default(0)) == 1 and item.stat.mode == '0600' and item.stat.size > 0)
    fail_msg: >-
      Refusing the session policy: {{ item.item }} must be a nonempty single-link regular 0600 file (or a
      private directory) owned by uid {{ ansible_facts.user_uid }}, not a link. This role never
      creates, reads or repairs app passwords.
    quiet: true
  loop: "{{ chaldea_client_enrollment_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Name every directory from the protected root down to the policy
  ansible.builtin.set_fact:
    chaldea_client_session_policy_dirs: >-
      {%- set root = chaldea_client_session_policy_root -%}
      {%- set parts = (chaldea_client_session_policy_path | dirname | relpath(root)).split('/') -%}
      {%- set out = [root] -%}
      {%- for i in range(parts | length) -%}
      {%-   set _ = out.append((root | regex_replace('/$', '')) ~ '/' ~ (parts[:i + 1] | join('/'))) -%}
      {%- endfor -%}
      {{ out }}

- name: Inspect the policy's directories without following links
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop: "{{ chaldea_client_session_policy_dirs + [chaldea_client_session_policy_path] }}"
  register: chaldea_client_policy_before

- name: Refuse linked, foreign or shared-writable policy paths
  ansible.builtin.assert:
    that:
      - item.stat.exists or item.item not in chaldea_client_session_policy_dirs[:-2]
      - not item.stat.exists or not item.stat.islnk
      - not item.stat.exists or item.stat.uid == chaldea_client_session_policy_owner_uid | int
      - not item.stat.exists or item.stat.mode[-2] not in ['2', '3', '6', '7']
      - not item.stat.exists or item.stat.mode[-1] not in ['2', '3', '6', '7']
      - not item.stat.exists or item.stat.isdir or (item.item == chaldea_client_session_policy_path and item.stat.isreg and item.stat.nlink == 1)
    fail_msg: >-
      {{ item.item }} must be owned by uid {{ chaldea_client_session_policy_owner_uid }}, writable
      by no one else and not a link; the policy itself a single-link regular file.
    quiet: true
  loop: "{{ chaldea_client_policy_before.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Write the protected policy as its owner
  become: "{{ chaldea_client_session_policy_become }}"
  block:
    - name: Create the policy's own directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ chaldea_client_session_policy_owner }}"
        mode: "0755"
      loop: "{{ chaldea_client_session_policy_dirs[-2:] }}"

    - name: Render the session policy
      ansible.builtin.template:
        src: policy.json.j2
        dest: "{{ chaldea_client_session_policy_path }}"
        owner: "{{ chaldea_client_session_policy_owner }}"
        mode: "0644"
        follow: false

- name: Inspect the written policy and its directories
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop: "{{ chaldea_client_session_policy_dirs + [chaldea_client_session_policy_path] }}"
  register: chaldea_client_policy_after
  when: not ansible_check_mode

- name: Require the protected layout the client checks
  ansible.builtin.assert:
    that:
      - item.stat.exists and not item.stat.islnk
      - item.stat.uid == chaldea_client_session_policy_owner_uid | int
      - item.stat.mode[-2] not in ['2', '3', '6', '7'] and item.stat.mode[-1] not in ['2', '3', '6', '7']
      - item.stat.isdir or (item.stat.isreg and item.stat.nlink == 1 and item.stat.mode == '0644')
    fail_msg: "{{ item.item }} is not in the protected layout the client requires."
    quiet: true
  loop: "{{ chaldea_client_policy_after.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode
