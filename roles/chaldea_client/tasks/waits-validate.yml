---
- name: Refuse incompatible waits policy and service modes before writes
  ansible.builtin.assert:
    that:
      - chaldea_client_waits_service_mode in ['user', 'system']
      - chaldea_client_waits_legacy_user_node_version | default('') is string
      - >-
        chaldea_client_waits_legacy_user_node_version | default('') == '' or
        (chaldea_client_waits_legacy_user_node_version is regex('[0-9]+[.][0-9]+[.][0-9]+', match_type='fullmatch') and
         chaldea_client_waits_service_mode == 'system' and chaldea_client_waits_enabled | bool)
      - chaldea_client_waits_deadline | default('') is string
      - chaldea_client_waits_deadline | default('') | length == 0 or chaldea_client_waits_service_mode == 'system'
      - not chaldea_client_waits_status_read_restart | default(false) or chaldea_client_waits_deadline | default('') | length > 0
      - not chaldea_client_session_policy_enabled | bool or chaldea_client_waits_service_mode == 'system'
      - chaldea_client_waits_service_mode != 'system' or chaldea_client_waits_enabled | bool
    fail_msg: Protected sessions require explicit system waits mode with waits enabled; user mode cannot map root.
    quiet: true
