---
- name: Refuse incompatible waits policy and service modes before writes
  ansible.builtin.assert:
    that:
      - chaldea_client_waits_service_mode in ['user', 'system']
      - not chaldea_client_session_policy_enabled | bool or chaldea_client_waits_service_mode == 'system'
      - chaldea_client_waits_service_mode != 'system' or chaldea_client_waits_enabled | bool
    fail_msg: Protected sessions require explicit system waits mode with waits enabled; user mode cannot map root.
    quiet: true
