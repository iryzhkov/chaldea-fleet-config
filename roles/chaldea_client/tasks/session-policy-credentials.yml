---
- name: Inspect operator-provisioned app passwords without reading them
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop: >-
    {{ (chaldea_client_session_enrollments | dict2items | map(attribute='value.secretFile') | list)
       + ([fleet_home ~ '/.config/chaldea/authentik'] if chaldea_client_session_enrollments | length > 0 else []) }}
  register: chaldea_client_enrollment_files

- name: Refuse unsafe app passwords and their directory
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - item.stat.uid | default(-1) == ansible_facts.user_uid | int
      - item.stat.mode | default('7777') is regex('^0[0-7]00$')
      - (item.stat.isdir | default(false)) if item.item.endswith('/authentik') else
        (item.stat.isreg | default(false) and item.stat.mode == '0600' and item.stat.size > 0)
    fail_msg: >-
      Refusing the session policy: {{ item.item }} must be a nonempty regular 0600 file (or a
      private directory) owned by uid {{ ansible_facts.user_uid }}, not a link. This role never
      creates, reads or repairs app passwords.
    quiet: true
  loop: "{{ chaldea_client_enrollment_files.results }}"
  loop_control:
    label: "{{ item.item }}"
