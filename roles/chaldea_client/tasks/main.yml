---
- name: Validate client pins and host configuration before changing files
  ansible.builtin.assert:
    that:
      - chaldea_client_version is match('^client-v[0-9]+[.][0-9]+[.][0-9]+$')
      - chaldea_client_sha256 is match('^[a-f0-9]{64}$')
      - >-
        (chaldea_client_route_targets | length == 0 and
         chaldea_client_claude_contexts | length == 0 and
         chaldea_client_claude_usage_source | length == 0) or
        chaldea_client_version | regex_replace('^client-v', '') is version('0.4.0', '>=')
      - not chaldea_client_waits_enabled or chaldea_client_waits_environment | length > 0
      - not chaldea_client_quota_enabled or chaldea_client_codex_home is match('^/')
      - chaldea_client_root == fleet_home ~ '/.local/share/chaldea'
    fail_msg: Set the published client version and SHA-256, waits environment and explicit Codex home in inventory.
    quiet: true

- name: Inspect operator-provisioned secrets without reading their contents
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop: "{{ ([{'unit': 'chaldea-quota', 'path': chaldea_client_quota_token}] if chaldea_client_quota_enabled else []) +
            ([{'unit': 'chaldea-waits', 'path': chaldea_client_waits_token},
              {'unit': 'chaldea-waits', 'path': chaldea_client_answer_token}] if chaldea_client_waits_enabled else []) }}"
  loop_control:
    label: "{{ item.unit }} credential {{ item.path }}"
  register: chaldea_client_secrets

- name: Refuse to start units without owner-only operator-provisioned secrets
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.uid | default(-1) == ansible_facts.user_uid | int
      - item.stat.mode | default('') == '0600'
      - item.stat.size | default(0) > 0
    fail_msg: >-
      Refusing to start {{ item.item.unit }}: operator must provision {{ item.item.path }}
      as a nonempty regular file owned by uid {{ ansible_facts.user_uid }} with mode 0600.
      This role never creates, reads or repairs tokens.
    quiet: true
  loop: "{{ chaldea_client_secrets.results }}"
  loop_control:
    label: "{{ item.item.unit }} credential {{ item.item.path }}"

- name: Inspect current release link
  ansible.builtin.stat:
    path: "{{ chaldea_client_root }}/current"
    follow: false
  register: chaldea_client_old_current

- name: Refuse to overwrite a non-link current path
  ansible.builtin.assert:
    that:
      - not chaldea_client_old_current.stat.exists or chaldea_client_old_current.stat.islnk
      - not chaldea_client_old_current.stat.exists or chaldea_client_old_current.stat.lnk_target | dirname == chaldea_client_root ~ '/releases'
    fail_msg: Inspect the unexpected current path before migrating.
    quiet: true

- name: Inspect the legacy checkout
  ansible.builtin.stat:
    path: "{{ chaldea_client_root }}/app/.git"
    follow: false
  register: chaldea_client_legacy

- name: Inspect the legacy backup destination
  ansible.builtin.stat:
    path: "{{ chaldea_client_root }}/app.pre-fleet"
    follow: false
  register: chaldea_client_legacy_backup

- name: Refuse to overwrite an earlier legacy backup
  ansible.builtin.assert:
    that:
      - not chaldea_client_legacy.stat.exists or not chaldea_client_legacy_backup.stat.exists
    fail_msg: Both app and app.pre-fleet exist; inspect them before completing migration.
    quiet: true

- name: Create client directories without touching other config or state
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: u+rwx
  loop:
    - "{{ chaldea_client_root }}"
    - "{{ fleet_home }}/.config/systemd/user"
    - "{{ fleet_home }}/.local/state/chaldea"
    - "{{ fleet_home }}/.local/bin"

- name: Create private client-owned directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ chaldea_client_root }}/releases"
    - "{{ chaldea_client_cache }}"
    - "{{ fleet_home }}/.config/chaldea"

- name: Fetch pinned client archive
  ansible.builtin.get_url:
    url: "{{ chaldea_client_release_url }}/chaldea-client.tar.gz"
    dest: "{{ chaldea_client_cache }}/{{ chaldea_client_version }}.tar.gz"
    checksum: "sha256:{{ chaldea_client_sha256 }}"
    mode: "0600"
  when: not ansible_check_mode and chaldea_client_archive_source | length == 0

- name: Stage fixture client archive
  ansible.builtin.copy:
    src: "{{ chaldea_client_archive_source }}"
    dest: "{{ chaldea_client_cache }}/{{ chaldea_client_version }}.tar.gz"
    mode: "0600"
  when: not ansible_check_mode and chaldea_client_archive_source | length > 0

- name: Fetch client manifest
  ansible.builtin.get_url:
    url: "{{ chaldea_client_release_url }}/manifest.json"
    dest: "{{ chaldea_client_cache }}/{{ chaldea_client_version }}.json"
    mode: "0600"
  when: not ansible_check_mode and chaldea_client_manifest_source | length == 0

- name: Stage fixture client manifest
  ansible.builtin.copy:
    src: "{{ chaldea_client_manifest_source }}"
    dest: "{{ chaldea_client_cache }}/{{ chaldea_client_version }}.json"
    mode: "0600"
  when: not ansible_check_mode and chaldea_client_manifest_source | length > 0

- name: Inspect cached archive
  ansible.builtin.stat:
    path: "{{ chaldea_client_cache }}/{{ chaldea_client_version }}.tar.gz"
  register: chaldea_client_cached

- name: Install verified immutable client release
  chaldea_client_release:
    root: "{{ chaldea_client_root }}/releases"
    archive: "{{ chaldea_client_cache }}/{{ chaldea_client_version }}.tar.gz"
    manifest: "{{ chaldea_client_cache }}/{{ chaldea_client_version }}.json"
    version: "{{ chaldea_client_version }}"
    sha256: "{{ chaldea_client_sha256 }}"
  register: chaldea_client_release
  when: chaldea_client_cached.stat.exists

- name: Explain fresh check-mode installation
  ansible.builtin.debug:
    msg: Client archive is not cached; apply will verify it before activating the client.
  when: ansible_check_mode and not chaldea_client_cached.stat.exists

- name: Predict configuration changes before writing unit or config files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ fleet_home }}/{{ item.dest }}"
    mode: "{{ item.mode }}"
  check_mode: true
  diff: false
  loop:
    - {src: chaldea-quota.service.j2, dest: .config/systemd/user/chaldea-quota.service, mode: "0644", enabled: true}
    - {src: chaldea-waits.service.j2, dest: .config/systemd/user/chaldea-waits.service, mode: "0644", enabled: true}
    - {src: waits.json.j2, dest: .config/chaldea/waits.json, mode: "0600", enabled: "{{ chaldea_client_waits_enabled }}"}
    - {src: quota.json.j2, dest: .config/chaldea/quota.json, mode: "0600", enabled: "{{ chaldea_client_codex_home | length > 0 }}"}
  when: item.enabled | bool
  register: chaldea_client_predicted

- name: Persist restart intent before changing definitions or release links
  ansible.builtin.copy:
    content: "Restart both enabled services after loading managed definitions.\n"
    dest: "{{ chaldea_client_cache }}/restart-required"
    mode: "0600"
  when: >-
    chaldea_client_predicted.changed or chaldea_client_legacy.stat.exists or
    chaldea_client_old_current.stat.lnk_target | default('') != chaldea_client_root ~ '/releases/' ~ chaldea_client_version

- name: Inspect durable restart intent from this or an interrupted run
  ansible.builtin.stat:
    path: "{{ chaldea_client_cache }}/restart-required"
  register: chaldea_client_restart

- name: Render waits configuration with a backup for migration
  ansible.builtin.template:
    src: waits.json.j2
    dest: "{{ fleet_home }}/.config/chaldea/waits.json"
    mode: "0600"
    backup: true
  register: chaldea_client_waits_config
  when: chaldea_client_waits_enabled

- name: Render explicit Codex balance binding
  ansible.builtin.template:
    src: quota.json.j2
    dest: "{{ fleet_home }}/.config/chaldea/quota.json"
    mode: "0600"
    backup: true
  register: chaldea_client_quota_config
  when: chaldea_client_codex_home | length > 0

- name: Render advisory routing and capacity policy
  ansible.builtin.template:
    src: "{{ item }}.json.j2"
    dest: "{{ fleet_home }}/.config/chaldea/{{ item }}.json"
    mode: "0600"
    backup: true
  loop: [route, capacity]

# The MCP entry point parses a waits config even when only routing is used.
# This supplies its socket without enabling a service or requiring any waits token.
- name: Render MCP bootstrap configuration on hosts without waits
  ansible.builtin.template:
    src: mcp.json.j2
    dest: "{{ fleet_home }}/.config/chaldea/mcp.json"
    mode: "0600"
  when: not chaldea_client_waits_enabled

- name: Atomically replace hand-made units with managed units
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "{{ fleet_home }}/.config/systemd/user/{{ item }}.service"
    mode: "0644"
    backup: true
  loop: [chaldea-quota, chaldea-waits]
  register: chaldea_client_units

- name: Retain the previously active release
  ansible.builtin.file:
    src: "{{ chaldea_client_old_current.stat.lnk_target }}"
    dest: "{{ chaldea_client_root }}/previous"
    state: link
  when:
    - chaldea_client_old_current.stat.exists
    - chaldea_client_old_current.stat.lnk_target != chaldea_client_root ~ '/releases/' ~ chaldea_client_version

- name: Activate the verified client after configuration and units are in place
  ansible.builtin.file:
    src: "{{ chaldea_client_root }}/releases/{{ chaldea_client_version }}"
    dest: "{{ chaldea_client_root }}/current"
    state: link
  register: chaldea_client_current
  when: not ansible_check_mode or chaldea_client_cached.stat.exists

- name: Install the launcher pointing at the managed current link
  ansible.builtin.template:
    src: "{{ role_path }}/../chaldea_job_client/templates/chaldea.j2"
    dest: "{{ fleet_home }}/.local/bin/chaldea"
    mode: "0755"

- name: Converge user units and restart on release or configuration changes
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.service"
    scope: user
    enabled: "{{ item.enabled }}"
    daemon_reload: true
    state: "{{ ('restarted' if (chaldea_client_restart.stat.exists or chaldea_client_current.changed or chaldea_client_units.changed or
              chaldea_client_waits_config.changed or chaldea_client_quota_config.changed) else 'started') if item.enabled else 'stopped' }}"
  loop:
    - {name: chaldea-quota, enabled: "{{ chaldea_client_quota_enabled }}"}
    - {name: chaldea-waits, enabled: "{{ chaldea_client_waits_enabled }}"}
  when: not ansible_check_mode

- name: Verify active managed definitions after unit convergence
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.service"
    scope: user
  loop:
    - {name: chaldea-quota, enabled: "{{ chaldea_client_quota_enabled }}"}
    - {name: chaldea-waits, enabled: "{{ chaldea_client_waits_enabled }}"}
  register: chaldea_client_loaded
  when: not ansible_check_mode

- name: Require enabled services to be active with managed definitions loaded
  ansible.builtin.assert:
    that:
      - item.status.ActiveState == 'active'
      - "'/.local/share/chaldea/current/bin/chaldea' in item.status.ExecStart"
    fail_msg: Managed service is not active with the current client definition; preserving legacy checkout and restart intent.
    quiet: true
  loop: "{{ chaldea_client_loaded.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not ansible_check_mode and item.item.enabled | bool

- name: Clear restart intent only after successful service verification
  ansible.builtin.file:
    path: "{{ chaldea_client_cache }}/restart-required"
    state: absent
  when: not ansible_check_mode

- name: Update only the Chaldea MCP registration before retiring the old checkout
  ansible.builtin.include_role:
    name: mcp_registrations
    tasks_from: chaldea
  vars:
    mcp_registrations_chaldea_waits_enabled: "{{ chaldea_client_waits_enabled }}"

- name: Preserve the legacy checkout after successful unit convergence
  ansible.builtin.command:
    argv: [mv, --no-clobber, "{{ chaldea_client_root }}/app", "{{ chaldea_client_root }}/app.pre-fleet"]
    creates: "{{ chaldea_client_root }}/app.pre-fleet"
  when: chaldea_client_legacy.stat.exists and not ansible_check_mode
  changed_when: true

- name: Inspect retained previous link
  ansible.builtin.stat:
    path: "{{ chaldea_client_root }}/previous"
    follow: false
  register: chaldea_client_previous

- name: Find only managed release directories
  ansible.builtin.find:
    paths: "{{ chaldea_client_root }}/releases"
    file_type: directory
    recurse: false
    follow: false
    use_regex: true
    patterns: ['^client-v[0-9]+[.][0-9]+[.][0-9]+$']
  register: chaldea_client_releases

- name: Remove managed releases older than current and previous
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ chaldea_client_releases.files }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - not ansible_check_mode
    - item.path != chaldea_client_root ~ '/releases/' ~ chaldea_client_version
    - item.path != chaldea_client_previous.stat.lnk_target | default('')

- name: Find managed client cache archives and manifests
  ansible.builtin.find:
    paths: "{{ chaldea_client_cache }}"
    file_type: file
    recurse: false
    use_regex: true
    patterns: ['^client-v[0-9]+[.][0-9]+[.][0-9]+[.](tar[.]gz|json)$']
  register: chaldea_client_cached_releases

- name: Remove caches for releases older than current and previous
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ chaldea_client_cached_releases.files }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - not ansible_check_mode
    - (item.path | basename | regex_replace('[.](tar[.]gz|json)$', '')) != chaldea_client_version
    - (item.path | basename | regex_replace('[.](tar[.]gz|json)$', '')) != (chaldea_client_previous.stat.lnk_target | default('') | basename)
