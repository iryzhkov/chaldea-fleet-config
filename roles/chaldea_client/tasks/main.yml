---
- name: Validate waits service mode before any mutation
  ansible.builtin.import_tasks: waits-validate.yml

# Keep this before every client write, including config, downloads and links.
# Both service modes and targeted chaldea_client pulls require the same admission.
- name: Admit the custom T3 pair before converging its client
  ansible.builtin.import_role:
    name: t3
    tasks_from: verify-custom
  when: t3_required_binary_sha256 | default('') | length > 0

- name: Inspect the reserved system waits owner before user convergence
  ansible.builtin.stat:
    path: /etc/systemd/system/chaldea-waits.service
    follow: false
    get_checksum: false
    get_mime: false
  register: chaldea_client_waits_system_owner
  when: chaldea_client_waits_service_mode == 'user'

- name: Refuse implicit rollback to a second database owner
  ansible.builtin.assert:
    that:
      - not chaldea_client_waits_system_owner.stat.exists
    fail_msg: System waits exists. Use the reviewed stop-system and restore-user rollback packet first.
    quiet: true
  when: chaldea_client_waits_service_mode == 'user'

- name: Converge the existing user client
  ansible.builtin.include_tasks: client.yml
  when: chaldea_client_waits_service_mode == 'user'

- name: Converge only the opted-in system waits service
  ansible.builtin.include_tasks: waits-system.yml
  when: chaldea_client_waits_service_mode == 'system'
