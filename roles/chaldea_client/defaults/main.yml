---
chaldea_client_enabled: false
chaldea_client_version: ""
chaldea_client_sha256: ""
# Preserve at most six explicit rollback versions in addition to current/previous.
# Retention never installs missing versions or selects the active client.
chaldea_client_retained_versions: []
chaldea_client_release_url: "https://github.com/iryzhkov/chaldea/releases/download/{{ chaldea_client_version }}"
# Local fixture inputs; empty in production.
chaldea_client_archive_source: ""
chaldea_client_manifest_source: ""
chaldea_client_root: "{{ fleet_home }}/.local/share/chaldea"
chaldea_client_cache: "{{ fleet_home }}/.cache/chaldea-client"
chaldea_client_quota_enabled: false
chaldea_client_waits_enabled: false
# System mode converges waits only, using the existing client and fleet account.
chaldea_client_waits_service_mode: user
# Optional one-canary window: strict UTC YYYY-MM-DDTHH:MM:SSZ, 16..2700 seconds
# remaining at execution. Empty preserves the persistent service byte for byte.
chaldea_client_waits_deadline: ""
# One explicit restart after terminal completion, to read durable status only.
# Never launches a reporter; the packet controller must prohibit new sessions.
chaldea_client_waits_status_read_restart: false
# Already-installed waits runtime only; never changes global current/previous.
chaldea_client_waits_runtime_root: "{{ chaldea_client_root }}/current"
chaldea_client_t3_home: "{{ fleet_home }}/.t3"
chaldea_client_quota_token: "{{ fleet_home }}/.config/chaldea/t3-token"
chaldea_client_waits_token: "{{ fleet_home }}/.config/chaldea/waits-t3-token"
chaldea_client_answer_token: "{{ fleet_home }}/.config/chaldea/waits-answer-token"
chaldea_client_waits_environment: ""
chaldea_client_waits_listen: "127.0.0.1"
chaldea_client_waits_port: 7385
chaldea_client_answer_url: "http://127.0.0.1:{{ chaldea_client_waits_port }}"
chaldea_client_waits_socket: "{{ ('/run/chaldea-waits-' ~ ansible_facts.user_uid ~ '/waits.sock') if chaldea_client_waits_service_mode == 'system' else ('/run/user/' ~ ansible_facts.user_uid ~ '/chaldea-waits.sock') }}"
# Explicit provider-to-auth-context binding, never inferred from the shell.
chaldea_client_codex_home: ""
chaldea_client_codex_providers: [codex]
chaldea_client_codex_command: "{{ fleet_home }}/.local/share/mise/shims/codex"
# Trust the binding above when T3 publishes no runtime home for Codex. The
# balance is then shown as operator-asserted; the worst case is displaying
# another account's balance, and nothing spends or acts on it.
chaldea_client_codex_assert_runtime_home: false
chaldea_client_low_headroom_percent: 10
# Route/capacity defaults. Role-target fields require a compatible client.
chaldea_client_claude_usage_enabled: false
chaldea_client_claude_usage_provider: claudeAgent
# Token paths only. Readers never render or copy credential contents.
chaldea_client_claude_usage_source: {}
chaldea_client_claude_contexts: []
# Explicit quota-only task subset; never changes the user client or helper pin.
chaldea_client_quota_runtime_enabled: false
chaldea_client_quota_runtime_version: ""
chaldea_client_quota_runtime_sha256: ""
chaldea_client_quota_fleet: {}
# Requires a FATE-capable client. Empty preserves compatibility on other hosts.
chaldea_client_route_targets: {}
chaldea_client_pace_margin: 0.10
chaldea_client_minimum_remaining: 0.10
chaldea_client_route_failure_margin: 0.10
chaldea_client_route_minimum_turns: 100
chaldea_client_quota_max_age_ms: 900000
chaldea_client_analytics_max_age_ms: 259200000
chaldea_client_heavy_multiplier: 2
chaldea_client_minimum_reset_lead_hours: 72
chaldea_client_recent_window_ms: 86400000
chaldea_client_reserve_fraction: 0.05
chaldea_client_expiry_horizon_ms: 86400000
# No illustrative credit conversion or unverified refill/expiry assertion.
chaldea_client_capacity_providers: {}
# Protected fixed session presets (docs/chaldea-client.md, "Session policy").
# Off: no policy file is rendered and waits.json names none. Enabling needs
# waits enabled; the policy is public configuration and holds no credential.
chaldea_client_session_policy_enabled: false
chaldea_client_session_ceilings: []
chaldea_client_session_presets: {}
# Authentik app-password enrollments keyed by preset ID. Each secretFile is an
# operator-provisioned file the role only inspects with stat. Needs a client
# whose policy parser accepts `enrollments`; empty renders no such key.
chaldea_client_session_enrollments: {}
