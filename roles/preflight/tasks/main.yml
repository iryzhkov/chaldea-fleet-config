---
- name: Refuse unfinished live preflight
  ansible.builtin.assert:
    that:
      - not (live_preflight_enabled | default(false) | bool)
      - not (pull_timer_enabled | default(false) | bool)
    fail_msg: Exact-CI live preflight is unfinished
  delegate_to: localhost

- name: Report offline validation result
  ansible.builtin.debug:
    msg: "Offline validation only; not converged"
