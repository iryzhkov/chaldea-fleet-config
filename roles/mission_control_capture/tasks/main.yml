---
- name: Configure the independent agent-a capture
  when: mission_control_capture_enabled | bool and not ansible_check_mode
  block:
    - name: Require the exact capture host and selected runtime
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'agent-a'
          - mission_control_runtime_enabled | bool
          - mission_control_capture_home == '/home/igor'
          - mission_control_capture_t3_base_dir is match('^/')
          - mission_control_capture_token_file is match('^/')
          - mission_control_capture_snapshot_file == mission_control_capture_home ~ '/.local/state/chaldea/mission-control/latest.json'
        quiet: true
    - name: Inspect owned units before stage-only writes
      ansible.builtin.service_facts:
      when: not mission_control_activate | bool
    - name: Refuse stage-only updates of an active or enabled unit
      ansible.builtin.assert:
        that:
          - ansible_facts.services.get('mission-control-capture.service', {}).get('state', 'stopped') not in ['running', 'active', 'activating', 'reloading']
          - ansible_facts.services.get('mission-control-capture.service', {}).get('status', 'disabled') not in ['enabled', 'enabled-runtime']
        fail_msg: Use one complete stage, verify and activate invocation for warm updates.
        quiet: true
      when: not mission_control_activate | bool
    - name: Inspect capture token metadata only
      ansible.builtin.stat:
        path: "{{ mission_control_capture_token_file }}"
        follow: false
        get_checksum: false
        get_mime: false
      register: mission_control_capture_token
    - name: Require an existing private igor read token
      ansible.builtin.assert:
        that:
          - mission_control_capture_token.stat.isreg | default(false)
          - not mission_control_capture_token.stat.islnk | default(false)
          - mission_control_capture_token.stat.uid | default(-1) == 1000
          - mission_control_capture_token.stat.mode | default('') == '0600'
          - mission_control_capture_token.stat.size | default(0) > 0
        quiet: true
    - name: Create only private capture directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: igor
        group: igor
        mode: "0700"
      loop:
        - "{{ mission_control_capture_home }}/.config/chaldea"
        - "{{ mission_control_capture_snapshot_file | dirname }}"
    - name: Write fixed capture configuration
      ansible.builtin.template:
        src: capture.json.j2
        dest: "{{ mission_control_capture_home }}/.config/chaldea/mission-control-capture.json"
        owner: igor
        group: igor
        mode: "0600"
      register: mission_control_capture_config
    - name: Write the capture unit
      ansible.builtin.template:
        src: mission-control-capture.service.j2
        dest: /etc/systemd/system/mission-control-capture.service
        owner: root
        group: root
        mode: "0644"
      register: mission_control_capture_unit
- name: Explain deferred capture check-mode staging
  ansible.builtin.debug:
    msg: Check mode defers staging and SYSTEM verification; absent accounts and bytes are not qualified.
  when: mission_control_capture_enabled | bool and ansible_check_mode
