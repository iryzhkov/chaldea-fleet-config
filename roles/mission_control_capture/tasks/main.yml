---
- name: Configure the independently selected private capture
  when: mission_control_capture_enabled | bool
  block:
    - name: Require the exact capture host and selected runtime
      ansible.builtin.assert:
        that:
          - inventory_hostname in ['agent-a', 'omarchy-pc', 'agent-b', 'laptop']
          - mission_control_capture_host == ('omarchy-macbook-air-igor' if inventory_hostname == 'laptop' else inventory_hostname)
          - mission_control_capture_uid | int == (1001 if inventory_hostname == 'laptop' else 1000)
          - inventory_hostname != 'laptop' or (mission_control_capture_laptop_qualified | bool and mission_control_runtime_version != 'client-v0.4.4')
          - mission_control_runtime_enabled | bool
          - mission_control_capture_home == '/home/igor'
          - mission_control_capture_t3_base_dir is match('^/')
          - mission_control_capture_token_file is match('^/')
          - mission_control_capture_snapshot_file == mission_control_capture_home ~ '/.local/state/chaldea/mission-control/latest.json'
        quiet: true
    - name: Inspect owned units before stage-only writes
      ansible.builtin.service_facts:
      when: not mission_control_activate | bool and not ansible_check_mode
    - name: Refuse stage-only updates of an active or enabled unit
      ansible.builtin.assert:
        that:
          - ansible_facts.services.get('mission-control-capture.service', {}).get('state', 'stopped') not in ['running', 'active', 'activating', 'reloading']
          - ansible_facts.services.get('mission-control-capture.service', {}).get('status', 'disabled') not in ['enabled', 'enabled-runtime']
        fail_msg: Use one complete stage, verify and activate invocation for warm updates.
        quiet: true
      when: not mission_control_activate | bool and not ansible_check_mode
    - name: Inspect capture token metadata only
      ansible.builtin.stat:
        path: "{{ mission_control_capture_token_file }}"
        follow: false
        get_checksum: false
        get_mime: false
      register: mission_control_capture_token
    - name: Require an existing private igor read token
      ansible.builtin.assert:
        that:
          - mission_control_capture_token.stat.isreg | default(false)
          - not mission_control_capture_token.stat.islnk | default(false)
          - mission_control_capture_token.stat.uid | default(-1) == mission_control_capture_uid | int
          - mission_control_capture_token.stat.mode | default('') == '0600'
          - mission_control_capture_token.stat.size | default(0) > 0
        quiet: true
    - name: Inspect existing capture identities for a materializable CHECK
      ansible.builtin.command:
        argv: [getent, "{{ item.0 }}", "{{ item.1 }}"]
      loop: [[passwd, igor], [group, igor]]
      changed_when: false
      failed_when: mission_control_capture_check_identities.rc not in [0, 2]
      check_mode: false
      register: mission_control_capture_check_identities
      when: ansible_check_mode
    - name: Inspect existing capture parents for CHECK diffs
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop:
        - "{{ mission_control_capture_home }}/.config/chaldea"
        - "{{ mission_control_capture_snapshot_file | dirname }}"
        - /etc/systemd/system
      register: mission_control_capture_check_parents
      when: ansible_check_mode
    - name: Stage capture files or predict changes against existing identities and parents
      when: >-
        not ansible_check_mode or
        (mission_control_capture_check_identities.results | selectattr('rc', 'ne', 0) | list | length == 0 and
         mission_control_capture_check_parents.results | selectattr('stat.isdir', 'defined') | selectattr('stat.isdir') | list | length == 3)
      block:
        - name: Create only private capture directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: igor
            group: igor
            mode: "0700"
          loop:
            - "{{ mission_control_capture_home }}/.config/chaldea"
            - "{{ mission_control_capture_snapshot_file | dirname }}"
        - name: Write fixed capture configuration
          ansible.builtin.template:
            src: capture.json.j2
            dest: "{{ mission_control_capture_home }}/.config/chaldea/mission-control-capture.json"
            owner: igor
            group: igor
            mode: "0600"
          register: mission_control_capture_config
        - name: Write the capture unit
          ansible.builtin.template:
            src: mission-control-capture.service.j2
            dest: /etc/systemd/system/mission-control-capture.service
            owner: root
            group: root
            mode: "0644"
          register: mission_control_capture_unit
    - name: Explain deferred cold capture CHECK staging
      ansible.builtin.debug:
        msg: Cold CHECK defers staging because required identities or parents are absent; predicted accounts and files are not qualified.
      when: ansible_check_mode and mission_control_capture_config is skipped
    - name: Explain deferred capture SYSTEM verification in CHECK
      ansible.builtin.debug:
        msg: CHECK template diffs are predictions; target SYSTEM verification is deferred until installed bytes exist in a real invocation.
      when: ansible_check_mode
