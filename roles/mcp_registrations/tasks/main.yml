---
# Route-enabled clients register Chaldea for all three harnesses. Other servers
# retain their existing provider ownership.
- name: Register the Chaldea MCP server
  ansible.builtin.import_tasks: chaldea.yml
- name: Register the fleet's MCP servers
  mcp_registration:
    provider: "{{ item.0 }}"
    name: "{{ item.1.name }}"
    state: "{{ 'present' if item.1.enabled | default(true) | bool else 'absent' }}"
    command: "{{ item.1.command | default(omit) }}"
    args: "{{ item.1.args | default([]) }}"
    env: >-
      {{ item.1.env | default({})
         | combine({item.1.agent_env: item.0 ~ '-' ~ mcp_registrations_agent_host} if item.1.agent_env is defined else {}) }}
    extra: "{{ item.1[item.0] | default({}) }}"
    claude_command: "{{ mcp_registrations_claude }}"
    codex_config: "{{ mcp_registrations_codex_config }}"
    opencode_config: "{{ mcp_registrations_opencode_config }}"
  loop: "{{ mcp_registrations_providers | product(mcp_registrations_servers | rejectattr('name', 'equalto', 'chaldea') | list) | list }}"
  loop_control:
    label: "{{ item.0 }}: {{ item.1.name }}"

# Remote servers own their names: no stdio or retired entry may share one.
- name: Stage explicitly enabled managed interactive credentials and helper
  ansible.builtin.include_role:
    name: webmcp_interactive
    apply:
      tags: [mcp_registrations]
  when: webmcp_interactive_enabled | default(false) | bool

# Its own explicit selection; Claude and Codex registrations are unaffected.
- name: Deliver or remove the ordinary OpenCode Jocasta plugin
  ansible.builtin.include_role:
    name: webmcp_interactive
    tasks_from: opencode.yml
    apply:
      tags: [mcp_registrations]
  when: webmcp_interactive_opencode_state | default('') | length > 0

- name: Select explicit managed authentication without widening other registrations
  ansible.builtin.set_fact:
    mcp_registrations_effective_remote_servers: >-
      {{ (mcp_registrations_remote_servers | rejectattr('name', 'equalto', 'jocasta') | list)
         + [{'name': 'jocasta', 'url': 'https://jocasta.mcp.ryzhkov.dev/mcp',
             'providers': ['claude', 'codex'], 'auth_mode': 'managed_helper',
             'helper_host': inventory_hostname,
             'state': (mcp_registrations_remote_servers | selectattr('name', 'equalto', 'jocasta')
                       | map(attribute='state', default='present') | first | default('present'))}]
         if webmcp_interactive_enabled | default(false) | bool else mcp_registrations_remote_servers }}

# The closed laptop OV entry exists only with both explicit opt-ins. The module
# refuses any helper_host other than laptop, and the staged role refuses other hosts.
- name: Select the closed laptop OV Codex entry only on its own explicit opt-in
  ansible.builtin.set_fact:
    mcp_registrations_effective_remote_servers: >-
      {{ (mcp_registrations_effective_remote_servers | rejectattr('name', 'equalto', 'ov') | list)
         + [{'name': 'ov', 'url': 'https://ov.mcp.ryzhkov.dev/mcp',
             'providers': ['codex'], 'auth_mode': 'managed_helper',
             'helper_host': inventory_hostname,
             'state': (mcp_registrations_remote_servers | selectattr('name', 'equalto', 'ov')
                       | map(attribute='state', default='present') | first | default('present'))}] }}
  when:
    - webmcp_interactive_enabled | default(false) | bool
    - webmcp_interactive_ov_enabled | default(false) | bool

# The full interactive OV successor keeps the name "ov" for Claude and Codex on
# laptop or omarchy-pc, so it replaces the narrow laptop Codex entry instead of
# duplicating its tools. Its own opt-in, never together with the narrow one.
# The module refuses any other host; the staged role checks credential custody.
- name: Select the full interactive OV entry only on its own explicit opt-in
  ansible.builtin.set_fact:
    mcp_registrations_effective_remote_servers: >-
      {{ (mcp_registrations_effective_remote_servers | rejectattr('name', 'equalto', 'ov') | list)
         + [{'name': 'ov', 'url': 'https://ov.mcp.ryzhkov.dev/mcp',
             'providers': ['claude', 'codex'], 'auth_mode': 'managed_helper',
             'helper_host': inventory_hostname, 'helper_profile': 'ov-full',
             'state': (mcp_registrations_remote_servers | selectattr('name', 'equalto', 'ov')
                       | map(attribute='state', default='present') | first | default('present'))}] }}
  when:
    - webmcp_interactive_enabled | default(false) | bool
    - webmcp_interactive_ov_full_enabled | default(false) | bool

- name: Check the opt-in remote MCP servers
  ansible.builtin.assert:
    that:
      - mcp_registrations_effective_remote_servers | map(attribute='name') | unique | list | length == mcp_registrations_effective_remote_servers | length
      - >-
        mcp_registrations_effective_remote_servers | map(attribute='name')
        | intersect(mcp_registrations_servers | map(attribute='name') | list + mcp_registrations_retired) | length == 0
      - mcp_registrations_effective_remote_servers | rejectattr('providers', 'defined') | list | length == 0
      - >-
        mcp_registrations_effective_remote_servers | map(attribute='providers') | flatten
        | difference(['claude', 'codex', 'opencode']) | length == 0
      - mcp_registrations_effective_remote_servers | map(attribute='state', default='present') | difference(['present', 'absent']) | length == 0
    fail_msg: Each remote MCP server needs a unique name of its own, a providers list and state present or absent.
    quiet: true
  when: mcp_registrations_effective_remote_servers | length > 0

- name: Register the opt-in remote MCP servers
  mcp_registration:
    provider: "{{ item.1 }}"
    name: "{{ item.0.name }}"
    state: "{{ item.0.state | default('present') }}"
    transport: remote
    auth_mode: "{{ item.0.auth_mode | default('oauth') }}"
    helper_host: "{{ item.0.helper_host | default(omit) }}"
    helper_profile: "{{ item.0.helper_profile | default(omit) }}"
    url: "{{ item.0.url | default(omit) }}"
    extra: "{{ item.0[item.1] | default({}) }}"
    claude_command: "{{ mcp_registrations_claude }}"
    claude_config: "{{ mcp_registrations_claude_config }}"
    codex_config: "{{ mcp_registrations_codex_config }}"
    opencode_config: "{{ mcp_registrations_opencode_config }}"
  loop: "{{ mcp_registrations_effective_remote_servers | subelements('providers') }}"
  loop_control:
    label: "{{ item.1 }}: {{ item.0.name }}"

- name: Remove retired MCP servers
  mcp_registration:
    provider: "{{ item.0 }}"
    name: "{{ item.1 }}"
    state: absent
    claude_command: "{{ mcp_registrations_claude }}"
    codex_config: "{{ mcp_registrations_codex_config }}"
    opencode_config: "{{ mcp_registrations_opencode_config }}"
  loop: "{{ mcp_registrations_providers | product(mcp_registrations_retired) | list }}"
  loop_control:
    label: "{{ item.0 }}: {{ item.1 }}"
