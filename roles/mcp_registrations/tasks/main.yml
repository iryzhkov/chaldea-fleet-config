---
# A disabled host actively removes its Chaldea registration. This intentionally
# enforces the host opt-in rather than leaving a previously registered server active.
- name: Register the fleet's MCP servers
  mcp_registration:
    provider: "{{ item.0 }}"
    name: "{{ item.1.name }}"
    state: "{{ 'present' if item.1.enabled | default(true) | bool else 'absent' }}"
    command: "{{ item.1.command }}"
    args: "{{ item.1.args | default([]) }}"
    env: >-
      {{ item.1.env | default({})
         | combine({item.1.agent_env: item.0 ~ '-' ~ mcp_registrations_agent_host} if item.1.agent_env is defined else {}) }}
    extra: "{{ item.1[item.0] | default({}) }}"
    claude_command: "{{ mcp_registrations_claude }}"
    codex_config: "{{ mcp_registrations_codex_config }}"
  loop: "{{ mcp_registrations_providers | product(mcp_registrations_servers) | list }}"
  loop_control:
    label: "{{ item.0 }}: {{ item.1.name }}"

- name: Remove retired MCP servers
  mcp_registration:
    provider: "{{ item.0 }}"
    name: "{{ item.1 }}"
    state: absent
    claude_command: "{{ mcp_registrations_claude }}"
    codex_config: "{{ mcp_registrations_codex_config }}"
  loop: "{{ mcp_registrations_providers | product(mcp_registrations_retired) | list }}"
  loop_control:
    label: "{{ item.0 }}: {{ item.1 }}"
