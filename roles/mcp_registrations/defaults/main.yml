---
# The MCP servers this fleet provides, registered with Claude Code (user
# scope, through the claude CLI) and Codex ([mcp_servers.NAME] in
# config.toml). Other registrations on a host are left alone. agent_env names
# a variable set to PROVIDER-HOST, which tells OpenViking who wrote a note.
# Routing runs in the stdio process; waits still require the separate local service.
mcp_registrations_chaldea_waits_enabled: false
mcp_registrations_chaldea_providers: [claude, codex, opencode]
mcp_registrations_opencode_config: "{{ fleet_home }}/.config/opencode/opencode.json"
mcp_registrations_servers:
  - name: chaldea
    enabled: "{{ chaldea_client_enabled | default(false) | bool or mcp_registrations_chaldea_waits_enabled | bool }}"
    command: "{{ fleet_home }}/.local/share/mise/installs/node/{{ chaldea_node_version }}/bin/node"
    args:
      - "{{ fleet_home }}/.local/share/chaldea/{{ 'current/bin/chaldea' if chaldea_client_enabled | default(false) else 'app/src/cli.ts' }}"
      - mcp
      - --config
      - "{{ fleet_home }}/.config/chaldea/{{ 'waits' if mcp_registrations_chaldea_waits_enabled | bool else 'mcp' }}.json"
  - name: huyang
    command: "{{ fleet_home }}/.local/share/huyang/{{ 'current/' if huyang_enabled | default(false) | bool else '' }}bin/huyang"
    args: [mcp, --profile, full]
    claude: {alwaysLoad: true}
    codex: {env_vars: [XDG_RUNTIME_DIR, HUYANG_SOCKET]}
  - name: ov-memory
    command: "{{ fleet_home }}/.local/bin/ov-memory-mcp"
    env: {OV_BASE_URL: "https://ov.ryzhkov.dev"}
    agent_env: OV_AGENT
    # Codex starts stdio servers with a cleared environment. The wrapper's
    # keyring lookup (secret-tool) needs the desktop session bus. Failed or
    # empty keyring lookups fall back to the existing keyfile.
    codex: {default_tools_approval_mode: approve, env_vars: [DBUS_SESSION_BUS_ADDRESS, XDG_RUNTIME_DIR]}
# Registrations removed from both providers wherever they are found.
mcp_registrations_retired:
  - local-file-llm
mcp_registrations_agent_host: "{{ inventory_hostname }}"
mcp_registrations_providers: [claude, codex]
mcp_registrations_claude: [claude]
mcp_registrations_codex_config: "{{ fleet_home }}/.codex/config.toml"
