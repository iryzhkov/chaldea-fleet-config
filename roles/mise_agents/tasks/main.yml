---
- name: Select agent tools not declared by the user
  mise_agent_tools:
    home: "{{ fleet_home }}"
    dropin: "{{ mise_agents_dropin }}"
    tools: "{{ mise_agents_tools }}"
  register: mise_agents_owned

- name: Report agent CLIs owned by user configuration
  ansible.builtin.debug:
    msg: "User mise configuration owns {{ mise_agents_owned.overridden | join(', ') }}; fleet declaration and installation skipped"
  when: mise_agents_owned.overridden | length > 0

- name: Create the mise drop-in directory
  ansible.builtin.file:
    path: "{{ mise_agents_dropin | dirname }}"
    state: directory
    mode: "0755"

- name: List the agent CLIs in the mise drop-in
  ansible.builtin.template:
    src: agents.toml.j2
    dest: "{{ mise_agents_dropin }}"
    mode: "0644"

- name: Find the newest release of each agent CLI old enough to install
  ansible.builtin.command:
    argv: [mise, latest, "{{ item.name }}"]
    chdir: "{{ fleet_home }}"
  environment:
    MISE_MINIMUM_RELEASE_AGE: "{{ mise_agents_minimum_release_age }}"
  loop: "{{ mise_agents_owned.tools }}"
  loop_control:
    label: "{{ item.name }}"
  register: mise_agents_latest
  changed_when: false
  failed_when: false
  when: mise_agents_install | bool and not ansible_check_mode

# An unreachable registry leaves the installed versions in place.
- name: Report agent CLIs whose newest release could not be read
  ansible.builtin.debug:
    msg: "mise latest {{ item.item.name }} failed: {{ item.stderr | default('') | trim }}"
  loop: "{{ mise_agents_latest.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.rc is defined
    - item.rc != 0 or item.stdout | trim | length == 0

- name: Install the newest release of each agent CLI old enough
  ansible.builtin.command:
    argv:
      - mise
      - install
      - "{{ item.item.name }}{{ '[' ~ item.item.install_options ~ ']' if item.item.install_options is defined else '' }}@{{ item.stdout | trim }}"
    chdir: "{{ fleet_home }}"
    creates: "{{ mise_agents_installs }}/{{ item.item.name | replace(':', '-') | replace('@', '') | replace('/', '-') }}/{{ item.stdout | trim }}"
  loop: "{{ mise_agents_latest.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}@{{ item.stdout | default('') | trim }}"
  when:
    - item.rc is defined
    - item.rc == 0
    - item.stdout | trim | length > 0
