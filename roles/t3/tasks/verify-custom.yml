---
# Read-only admission shared by normal T3 checks and the client's first preflight.
- name: Validate the custom T3 pin before any client mutation
  ansible.builtin.assert:
    that:
      - t3_required_binary_sha256 is match('^[a-f0-9]{64}$')
      - t3_custom_source is match('^[a-f0-9]{40}$')
      - t3_custom_archive_sha256 is match('^[a-f0-9]{64}$')
      - t3_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
      - not t3_allow_upgrade | bool
    fail_msg: Custom T3 requires exact provenance and manual coordinated activation. Do not use t3 update for this pin.
    quiet: true

- name: Read the selected custom T3 version
  ansible.builtin.slurp:
    src: "{{ t3_home }}/runtime/service-state.json"
  register: t3_guard_selection

- name: Inspect the selected custom T3 binary
  ansible.builtin.stat:
    path: "{{ t3_home }}/runtime/versions/{{ t3_version }}/t3"
    follow: false
    checksum_algorithm: sha256
    get_mime: false
  register: t3_guard_binary

- name: Refuse a different T3 selection or binary
  ansible.builtin.assert:
    that:
      - (t3_guard_selection.content | b64decode | from_json).activeVersion == t3_version
      - t3_guard_binary.stat.isreg | default(false)
      - t3_guard_binary.stat.executable | default(false)
      - t3_guard_binary.stat.checksum | default('') == t3_required_binary_sha256
    fail_msg: The custom T3 selection or binary differs from its pin. Activate the exact reviewed pair manually before pulling.
    quiet: true

- name: Inspect the loaded custom T3 service
  ansible.builtin.systemd_service:
    name: "{{ t3_service }}"
    scope: user
  register: t3_guard_service

- name: Read the running T3 server identity
  ansible.builtin.slurp:
    src: "{{ t3_home }}/userdata/server-runtime.json"
  register: t3_guard_runtime

- name: Refuse an inactive or mismatched T3 service
  ansible.builtin.assert:
    that:
      - t3_guard_service.status.ActiveState == 'active'
      - t3_guard_service.status.SubState == 'running'
      - t3_guard_service.status.NeedDaemonReload | default('unknown') == 'no'
      - t3_guard_service.status.MainPID | int > 1
      - >-
        ('{ path=' ~ t3_home ~ '/runtime/versions/' ~ t3_version ~ '/t3 ; argv[]=' ~
         t3_home ~ '/runtime/versions/' ~ t3_version ~ '/t3 __service-launcher ;')
        in t3_guard_service.status.ExecStart | default('')
      - (t3_guard_runtime.content | b64decode | from_json).serviceManaged | bool
      - (t3_guard_runtime.content | b64decode | from_json).serverVersion == t3_version
      - (t3_guard_runtime.content | b64decode | from_json).pid | int > 1
    fail_msg: The loaded service and running server must select the exact custom T3 pin with known NeedDaemonReload=no. No client files have been changed.
    quiet: true

# Hash the live executables as well as the selected file: replacing a unit or
# on-disk binary without restarting must not admit a mismatched running pair.
- name: Inspect the running T3 launcher and server executables
  ansible.builtin.stat:
    path: "/proc/{{ item }}/exe"
    follow: true
    checksum_algorithm: sha256
    get_mime: false
  loop:
    - "{{ t3_guard_service.status.MainPID }}"
    - "{{ (t3_guard_runtime.content | b64decode | from_json).pid }}"
  register: t3_guard_processes

- name: Refuse different running T3 bytes
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - item.stat.checksum | default('') == t3_required_binary_sha256
    fail_msg: The live T3 executable differs from the custom pin. Complete coordinated activation before changing the client.
    quiet: true
  loop: "{{ t3_guard_processes.results }}"
  loop_control:
    label: "{{ item.item }}"
