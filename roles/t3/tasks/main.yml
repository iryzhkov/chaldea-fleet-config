---
- name: Read the active T3 version
  ansible.builtin.slurp:
    src: "{{ t3_home }}/runtime/service-state.json"
  register: t3_state

- name: Record the active T3 version
  ansible.builtin.set_fact:
    t3_active_version: "{{ (t3_state.content | b64decode | from_json).activeVersion }}"

- name: Assert T3 meets the minimum version
  ansible.builtin.assert:
    that:
      - t3_active_version is version(t3_min_version, '>=', version_type='semver')
    fail_msg: >-
      T3 is {{ t3_active_version }} but the minimum is {{ t3_min_version }}.
      Update T3 through its native updater before converging the fleet.
    quiet: true

- name: Read the T3 service state
  ansible.builtin.systemd_service:
    name: "{{ t3_service }}"
    scope: user
  register: t3_service_state

- name: Assert the T3 service is active
  ansible.builtin.assert:
    that:
      - t3_service_state.status.ActiveState == 'active'
    fail_msg: "{{ t3_service }} is {{ t3_service_state.status.ActiveState }}"
    quiet: true

- name: Discover newer stable T3 releases without changing the runtime
  ansible.builtin.include_tasks: update-check.yml
  when: t3_update_check_enabled | bool and not ansible_check_mode
