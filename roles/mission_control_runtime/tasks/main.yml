---
- name: Install only the explicitly selected Mission Control release
  when: mission_control_runtime_enabled | bool
  block:
    - name: Require independent immutable release inputs
      ansible.builtin.assert:
        that:
          - mission_control_runtime_version is regex('^client-v[0-9]+[.][0-9]+[.][0-9]+$', match_type='fullmatch')
          - mission_control_runtime_sha256 is regex('^[a-f0-9]{64}$', match_type='fullmatch')
          - mission_control_runtime_release_root == '/opt/chaldea-mission-control'
          - mission_control_runtime_node == '/opt/chaldea/node/bin/node'
        quiet: true
    - name: Inspect protected runtime ancestors without following links
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop:
        - /opt
        - "{{ mission_control_runtime_release_root }}"
        - "{{ mission_control_runtime_release_root }}/releases"
        - "{{ mission_control_runtime_release_root }}/cache"
        - "{{ mission_control_runtime_node | dirname | dirname }}"
        - "{{ mission_control_runtime_node | dirname }}"
        - "{{ mission_control_runtime_node }}"
      register: mission_control_runtime_ancestors
    - name: Refuse writable or linked runtime ancestors
      ansible.builtin.assert:
        that:
          - not item.stat.exists or not item.stat.islnk | default(false)
          - not item.stat.exists or item.stat.uid == 0
          - not item.stat.exists or item.stat.mode[-2] not in ['2', '3', '6', '7']
          - not item.stat.exists or item.stat.mode[-1] not in ['2', '3', '6', '7']
        quiet: true
      loop: "{{ mission_control_runtime_ancestors.results }}"
      loop_control:
        label: "{{ item.item }}"
    - name: Create protected Mission Control release directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: ["{{ mission_control_runtime_release_root }}", "{{ mission_control_runtime_release_root }}/releases", "{{ mission_control_runtime_release_root }}/cache"]
    - name: Fetch the selected archive and manifest
      ansible.builtin.get_url:
        url: "https://github.com/iryzhkov/chaldea/releases/download/{{ mission_control_runtime_version }}/{{ item.name }}"
        dest: "{{ mission_control_runtime_release_root }}/cache/{{ mission_control_runtime_version }}{{ item.suffix }}"
        checksum: "{{ 'sha256:' ~ mission_control_runtime_sha256 if item.name == 'chaldea-client.tar.gz' else omit }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - {name: chaldea-client.tar.gz, suffix: .tar.gz, source: "{{ mission_control_runtime_archive_source }}"}
        - {name: manifest.json, suffix: .json, source: "{{ mission_control_runtime_manifest_source }}"}
      when: not ansible_check_mode and item.source | length == 0
    - name: Stage explicitly supplied release fixtures
      ansible.builtin.copy:
        src: "{{ item.source }}"
        dest: "{{ mission_control_runtime_release_root }}/cache/{{ mission_control_runtime_version }}{{ item.suffix }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - {suffix: .tar.gz, source: "{{ mission_control_runtime_archive_source }}"}
        - {suffix: .json, source: "{{ mission_control_runtime_manifest_source }}"}
      when: not ansible_check_mode and item.source | length > 0
    - name: Inspect the staged archive
      ansible.builtin.stat:
        path: "{{ mission_control_runtime_release_root }}/cache/{{ mission_control_runtime_version }}.tar.gz"
      register: mission_control_runtime_archive
    - name: Inspect the staged manifest
      ansible.builtin.stat:
        path: "{{ mission_control_runtime_release_root }}/cache/{{ mission_control_runtime_version }}.json"
      register: mission_control_runtime_manifest
    - name: Explain deferred runtime validation in CHECK
      ansible.builtin.debug:
        msg: CHECK predicts missing runtime downloads or fixture staging; canonical validation deferred until both staged artifacts exist.
      when: ansible_check_mode and (not mission_control_runtime_archive.stat.exists or not mission_control_runtime_manifest.stat.exists)
    - name: Validate and install using the canonical client release module
      chaldea_client_release:
        root: "{{ mission_control_runtime_release_root }}/releases"
        archive: "{{ mission_control_runtime_release_root }}/cache/{{ mission_control_runtime_version }}.tar.gz"
        manifest: "{{ mission_control_runtime_release_root }}/cache/{{ mission_control_runtime_version }}.json"
        version: "{{ mission_control_runtime_version }}"
        sha256: "{{ mission_control_runtime_sha256 }}"
        check_permissions: true
      when: not ansible_check_mode or (mission_control_runtime_archive.stat.exists and mission_control_runtime_manifest.stat.exists)
    # The canonical installer stages mode0700. Permit locked consumers to traverse it.
    - name: Permit read-only traversal of the verified release
      ansible.builtin.file:
        path: "{{ mission_control_runtime_release_root }}/releases/{{ mission_control_runtime_version }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: not ansible_check_mode or mission_control_runtime_archive.stat.exists
    - name: Find managed Mission Control releases without following links
      ansible.builtin.find:
        paths: "{{ mission_control_runtime_release_root }}/releases"
        file_type: directory
        recurse: false
        follow: false
        use_regex: true
        patterns: ['^client-v[0-9]+[.][0-9]+[.][0-9]+$']
      register: mission_control_runtime_releases
      when: not ansible_check_mode
    - name: Retain the selected release and newest prior release
      ansible.builtin.set_fact:
        mission_control_runtime_retained_paths: >-
          {{ [mission_control_runtime_release_root ~ '/releases/' ~ mission_control_runtime_version] +
             (mission_control_runtime_releases.files | rejectattr('path', 'equalto', mission_control_runtime_release_root ~ '/releases/' ~ mission_control_runtime_version)
              | sort(attribute='mtime', reverse=true) | map(attribute='path') | list)[:1] }}
      when: not ansible_check_mode
    - name: Find inactive releases older than fourteen days
      ansible.builtin.find:
        paths: "{{ mission_control_runtime_release_root }}/releases"
        file_type: directory
        recurse: false
        follow: false
        use_regex: true
        patterns: ['^client-v[0-9]+[.][0-9]+[.][0-9]+$']
        age: 14d
        age_stamp: mtime
      register: mission_control_runtime_old_releases
      when: not ansible_check_mode
    - name: Prune only expired inactive Mission Control releases
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ mission_control_runtime_old_releases.files | default([]) }}"
      when: not ansible_check_mode and item.path not in mission_control_runtime_retained_paths
    - name: Find managed cached artifacts older than fourteen days
      ansible.builtin.find:
        paths: "{{ mission_control_runtime_release_root }}/cache"
        file_type: file
        recurse: false
        follow: false
        use_regex: true
        patterns: ['^client-v[0-9]+[.][0-9]+[.][0-9]+[.](tar[.]gz|json)$']
        age: 14d
        age_stamp: mtime
      register: mission_control_runtime_old_cache
      when: not ansible_check_mode
    - name: Prune only expired inactive Mission Control artifact cache
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ mission_control_runtime_old_cache.files | default([]) }}"
      when:
        - not ansible_check_mode
        - (item.path | basename | regex_replace('[.](tar[.]gz|json)$', '')) not in (mission_control_runtime_retained_paths | map('basename') | list)
