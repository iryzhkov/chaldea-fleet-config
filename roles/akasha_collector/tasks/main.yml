---
- name: Install the pinned host runtime artifact
  ansible.builtin.include_role:
    name: chaldea_host_artifact
    public: true

- name: Validate collector settings before enablement
  ansible.builtin.assert:
    that:
      - akasha_collector_url is match('^https://[A-Za-z0-9._:/-]+$')
      - akasha_collector_token_helper is match('^/[A-Za-z0-9._/-]+$')
      - akasha_collector_node is match('^/[A-Za-z0-9._/-]+$')
      - akasha_collector_script is match('^/[A-Za-z0-9._/-]+$')
      - akasha_collector_mission_control_snapshot_file | length == 0 or akasha_collector_mission_control_snapshot_file is regex('^/[A-Za-z0-9._/-]+$', match_type='fullmatch')
    fail_msg: Collector enablement requires HTTPS and a scoped service token helper
  when: akasha_collector_enabled | bool

- name: Create private collector and timer spool directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ fleet_home }}/.local/state/chaldea/events"
    - "{{ fleet_home }}/.local/state/chaldea/timer-spool"

- name: Create the collector command directory
  ansible.builtin.file:
    path: "{{ fleet_home }}/.local/bin"
    state: directory
    mode: "0755"

- name: Install the command sharing the timer collector state
  ansible.builtin.template:
    src: akasha-collector.j2
    dest: "{{ fleet_home }}/.local/bin/akasha-collector"
    mode: "0755"

- name: Render the collector service and timer
  ansible.builtin.set_fact:
    akasha_collector_service_unit: "{{ lookup('ansible.builtin.template', 'akasha-collector.service.j2') }}"
    akasha_collector_timer_unit: "{{ lookup('ansible.builtin.template', 'akasha-collector.timer.j2') }}"

- name: Install the host collector timer
  ansible.builtin.include_role:
    name: user_timer
  vars:
    user_timer_name: akasha-collector
    user_timer_service: "{{ akasha_collector_service_unit }}"
    user_timer_timer: "{{ akasha_collector_timer_unit }}"
    user_timer_enabled: "{{ akasha_collector_enabled }}"
