---
# Existing inventory controls enablement; runtime selection grants no new access.
akasha_collector_version: ""
akasha_collector_sha256: ""
akasha_collector_release_root: /opt/chaldea-akasha-host/releases
akasha_collector_cache: /var/cache/chaldea-akasha-host
akasha_collector_enabled: false
# Absent from generated configuration unless explicitly selected.
akasha_collector_url: ""
akasha_collector_token_helper: ""
akasha_collector_node: "{{ fleet_home }}/.local/share/mise/installs/node/{{ chaldea_node_version }}/bin/node"
akasha_collector_script: "{{ chaldea_host_artifact_root }}/akasha-collector.mjs"
