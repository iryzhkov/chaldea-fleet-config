---
- name: Validate explicit trust enrollment
  ansible.builtin.assert:
    that:
      - chaldea_access_trust_anchors | length > 0
      - chaldea_access_trust_anchors | length <= 8
      - chaldea_access_trust_node is match('^/[A-Za-z0-9/_.-]+$')
      - chaldea_access_trust_runtime is match('^/[A-Za-z0-9/_.-]+$')
      - chaldea_access_trust_root is match('^/[A-Za-z0-9/_.-]+$')
      - chaldea_access_trust_state is match('^/[A-Za-z0-9/_.-]+$')
      - chaldea_access_trust_public is match('^/[A-Za-z0-9/_.-]+$')
      - chaldea_access_trust_run is match('^/[A-Za-z0-9/_.-]+$')
    quiet: true

- name: Create protected trust directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ chaldea_access_trust_root }}", mode: "0755"}
    - {path: "{{ chaldea_access_trust_state }}", mode: "0700"}
    - {path: "{{ chaldea_access_trust_public }}", mode: "0755"}
    - {path: "{{ chaldea_access_trust_run }}", mode: "0755"}
    - {path: "{{ chaldea_access_trust_fetcher | dirname }}", mode: "0755"}

- name: Install independently pinned public anchors
  become: true
  ansible.builtin.copy:
    content: "{{ chaldea_access_trust_anchors | to_nice_json }}\n"
    dest: "{{ chaldea_access_trust_root }}/anchors.json"
    owner: root
    group: root
    mode: "0644"

- name: Install byte-only Git downloader
  become: true
  ansible.builtin.copy:
    src: fetch.py
    dest: "{{ chaldea_access_trust_fetcher }}"
    owner: root
    group: root
    mode: "0755"

- name: Install updater configuration
  become: true
  ansible.builtin.template:
    src: updater.json.j2
    dest: "{{ chaldea_access_trust_root }}/updater.json"
    owner: root
    group: root
    mode: "0644"

- name: Install trust units
  become: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ chaldea_access_trust_unit_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - chaldea-access-trust.service
    - chaldea-access-trust.timer
    - chaldea-clock-health.service
    - chaldea-clock-health.timer
  notify: Reload access trust units

# Neither initialization nor key generation is implicit in convergence.
- name: Enable trust timers only after operator bootstrap
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - chaldea-clock-health.timer
    - chaldea-access-trust.timer
