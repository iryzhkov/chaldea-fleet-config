---
# Exact retirement list only; preserve unmanaged skills and unrelated symlinks.
- name: Inspect retired skill paths without following symlinks
  ansible.builtin.stat:
    path: "{{ fleet_home }}/{{ item.0 }}/{{ item.1 }}"
    follow: false
    get_checksum: false
  loop: >-
    {{ ['.claude/skills', '.agents/skills'] |
       product(['find-skills', 'improve-codebase-architecture', 'domain-modeling',
                'prototype', 'code-review', 'implementation-session']) | list }}
  loop_control:
    label: "~/{{ item.0 }}/{{ item.1 }}"
  register: agent_config_retired_paths

- name: Remove only real directories for retired skills
  ansible.builtin.file:
    path: "{{ fleet_home }}/{{ item.item.0 }}/{{ item.item.1 }}"
    state: absent
  when:
    - item.stat.isdir | default(false)
    - not (item.stat.islnk | default(false))
  loop: "{{ agent_config_retired_paths.results }}"
  loop_control:
    label: "~/{{ item.item.0 }}/{{ item.item.1 }}"

- name: Remove only retired Claude links to absent retired shared skills
  ansible.builtin.file:
    path: "{{ fleet_home }}/.claude/skills/{{ item.item.1 }}"
    state: absent
    follow: false
  vars:
    agent_config_retired_shared: >-
      {{ agent_config_retired_paths.results
         | selectattr('item.0', 'equalto', '.agents/skills')
         | selectattr('item.1', 'equalto', item.item.1) | first }}
  when:
    - item.item.0 == '.claude/skills'
    - item.stat.islnk | default(false)
    - item.stat.lnk_target == '../../.agents/skills/' ~ item.item.1
    - >-
      not (agent_config_retired_shared.stat.exists | default(false)) or
      ((agent_config_retired_shared.stat.isdir | default(false)) and
       not (agent_config_retired_shared.stat.islnk | default(false)))
  loop: "{{ agent_config_retired_paths.results }}"
  loop_control:
    label: "~/.claude/skills/{{ item.item.1 }}"
