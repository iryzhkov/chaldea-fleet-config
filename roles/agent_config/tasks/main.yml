---
- name: Retire explicitly removed skills
  ansible.builtin.import_tasks: retire-skills.yml

- name: Distribute the owned OpenCode Huyang plugin
  ansible.builtin.import_tasks: opencode-huyang.yml

# u+rwx leaves the group and other bits of an existing directory alone.
- name: Create the parent directories of shared files
  ansible.builtin.file:
    path: "{{ fleet_home }}/{{ item }}"
    state: directory
    mode: u+rwx
  loop: "{{ (agent_config_files | map(attribute='dest') | map('dirname') | list + agent_config_skill_dirs) | unique }}"
  tags: [agent_guidance]

- name: Install shared instruction files and provider wrappers
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ fleet_home }}/{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ agent_config_files }}"
  loop_control:
    label: "~/{{ item.dest }}"
  tags: [agent_guidance]

- name: Install shared skills with guarded link migration
  ansible.builtin.import_tasks: install-skills.yml
  tags: [agent_guidance]
