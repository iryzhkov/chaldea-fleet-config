---
- name: Validate the five recorded laptop link paths and owners
  ansible.builtin.include_tasks:
    file: validate-managed-link.yml
    apply:
      tags: [agent_guidance]
  when: agent_config_skill_link.item.1 not in ['safety-critical-code', 'unslop']

- name: Inspect the approved skill link target
  ansible.builtin.stat:
    path: "{{ fleet_home }}/{{ agent_config_skill_link.item | join('/') }}"
    follow: true
    get_checksum: false
  register: agent_config_skill_link_target

- name: Require a directory target before comparing skill trees
  ansible.builtin.assert:
    that:
      - agent_config_skill_link_target.stat.isdir | default(false)
    fail_msg: "Skill link {{ agent_config_skill_link.item | join('/') }} has no directory target; stopping."
    quiet: true

# ansible-pull runs on the host itself, where role_path is available.
# Read-only comparison runs in check mode too. Extra files and nested links count.
- name: Require the full skill target tree to match the managed source
  ansible.builtin.command:
    argv:
      - diff
      - --brief
      - --recursive
      - --no-dereference
      - --
      - "{{ role_path }}/files/skills/{{ agent_config_skill_link.item.1 }}"
      - "{{ agent_config_skill_link.stat.lnk_source }}"
  register: agent_config_skill_link_comparison
  failed_when: agent_config_skill_link_comparison.rc not in [0, 1]
  changed_when: false
  check_mode: false

# The complete previous canonical tree is a pinned migration fixture, including
# UI metadata. Existing owner, ancestor and nested-link guards still apply.
- name: Compare the recorded historical conflict skill tree
  ansible.builtin.command:
    argv:
      - diff
      - --brief
      - --recursive
      - --no-dereference
      - --
      - "{{ role_path }}/fixtures/conflict-skill-82f3c9e"
      - "{{ agent_config_skill_link.stat.lnk_source }}"
  register: agent_config_skill_legacy_comparison
  failed_when: agent_config_skill_legacy_comparison.rc not in [0, 1]
  changed_when: false
  check_mode: false
  when:
    - agent_config_skill_link_comparison.rc == 1
    - inventory_hostname == 'laptop'
    - agent_config_skill_link.item.0 == '.claude/skills'
    - agent_config_skill_link.item.1 == 'resolving-merge-conflicts'

- name: Require current source or the exact historical conflict skill tree
  ansible.builtin.assert:
    that:
      - >-
        agent_config_skill_link_comparison.rc == 0 or
        (agent_config_skill_legacy_comparison.rc | default(-1)) == 0
    fail_msg: "Skill target differs from managed source and the exact approved historical tree; stopping."
    quiet: true
