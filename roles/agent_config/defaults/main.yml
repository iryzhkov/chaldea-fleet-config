---

# One complete profile object per session/environment. Restricted profiles must
# supply explicit tool/access grants and MCP grants; an empty map exposes no tools.
# This is instruction filtering, not command authorization.
agent_config_fleet_tools_profile:
  name: interactive-operator
  tools: {"*": [read, write]}
  mcp: [ov-memory]
agent_config_fleet_tools_directories: []
# The same command list that agent_tools installs, checked for actual executability.
agent_config_fleet_tools_executables: >-
  {{ (agent_tools_homelab_cli_commands | default([])
      | map('regex_replace', '^', (agent_tools_bin_dir | default(fleet_home ~ '/.local/bin')) ~ '/') | list)
     + [fleet_home ~ '/.local/bin/jocasta', fleet_home ~ '/.local/bin/chaldea'] }}
# .agents/skills is shared by Codex and OpenCode; Claude uses .claude/skills.
agent_config_fleet_tools_skill_dirs:
  - .claude/skills
  - .agents/skills
  - .codex/skills

# Shared instruction files, relative to the home directory. Per-host files such
# as ~/.claude/CLAUDE.md and ~/.claude.json are deliberately not managed.
agent_config_files:
  - {src: claude/omarchy-setup/CLAUDE.md, dest: .claude/omarchy-setup/CLAUDE.md}
  - {src: codex/AGENTS.md, dest: .codex/AGENTS.md}
  - {src: agents/AGENTS.md, dest: .config/agents/AGENTS.md}
  - {src: agents/jocasta.md, dest: .config/agents/jocasta.md}
  - {src: agents/huyang.md, dest: .config/agents/huyang.md}
  - {src: agents/ov-memory.md, dest: .config/agents/ov-memory.md}
  - {src: bin/opencode, dest: .local/bin/opencode, mode: "0755"}

# Fleet-owned skills. Other CLI-installed skills and symlinks stay unmanaged,
# except the exact retirement list and the seven validated laptop link migrations.
agent_config_skills:
  - audit-lens
  - chaldea
  - chaldea-audit
  - codebase-design
  - diagnosing-bugs
  - fleet-rollout
  - grilling
  - huyang
  - ov-memory
  - ov-memory-curation
  - resolving-merge-conflicts
  - review-delegation
  - roadmap-executor
  - roadmap-planner
  - safety-critical-code
  - sub-roadmap-executor
  - tdd
  - unslop
agent_config_skill_dirs:
  - .claude/skills
  - .agents/skills
