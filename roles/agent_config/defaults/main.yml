---
# Shared instruction files, relative to the home directory. Per-host files such
# as ~/.claude/CLAUDE.md and ~/.claude.json are deliberately not managed.
agent_config_files:
  - {src: claude/omarchy-setup/CLAUDE.md, dest: .claude/omarchy-setup/CLAUDE.md}
  - {src: codex/AGENTS.md, dest: .codex/AGENTS.md}
  - {src: agents/AGENTS.md, dest: .config/agents/AGENTS.md}
  - {src: agents/jocasta.md, dest: .config/agents/jocasta.md}
  - {src: agents/huyang.md, dest: .config/agents/huyang.md}
  - {src: agents/ov-memory.md, dest: .config/agents/ov-memory.md}
  - {src: bin/opencode, dest: .local/bin/opencode, mode: "0755"}

# Skills written for this fleet. Skills installed by the skills CLI (with
# ~/.agents/.skill-lock.json) and the Omarchy-provided symlinks stay with them.
agent_config_skills:
  - chaldea
  - huyang
  - implementation-session
  - ov-memory
  - ov-memory-curation
  - review-delegation
agent_config_skill_dirs:
  - .claude/skills
  - .agents/skills
