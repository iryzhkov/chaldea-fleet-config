---
# One synthetic agent host on whatever machine runs CI. Load it together with
# the real inventory, so the shared pins in inventory/group_vars apply, and
# limit the run to it:
#   ansible-playbook -i inventory -i tests/synthetic-inventory.yml --limit synthetic site.yml
# Its home is a scratch directory inside the checkout, so a run sees an empty
# host and never reads or writes the runner's own configuration. Host variables
# here take precedence over the group variables of the real inventory.
all:
  children:
    agent_hosts:
      hosts:
        synthetic:
          fleet_home: "{{ playbook_dir }}/.ci-home"
          expected_hostname: "{{ ansible_facts.hostname }}"
          data_disk_root: "{{ playbook_dir }}/.ci-home/data"
          agent_tools_credential_files:
            - {name: Synthetic token, path: .config/synthetic/token}
          mise_pins_install: false
          t3_enabled: false
          pull_timer_enabled: false
          retention_timer_enabled: false
