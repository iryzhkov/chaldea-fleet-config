---
# Rootless role test. The dummy file is deliberately not a usable private key.
- name: Exercise session-host SSH configuration with metadata-only enrollment
  hosts: localhost
  connection: local
  gather_facts: true
  gather_subset: [min]
  vars:
    chaldea_node_version: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../inventory/group_vars/all/main.yml') | from_yaml).chaldea_node_version }}"
    fleet_home: "{{ playbook_dir }}/../.ci-home/job-client"
    chaldea_job_client_enabled: true
    chaldea_job_client_targets:
      - {name: fixture, address: 192.0.2.123, port: 2222}
  pre_tasks:
    - name: Require an isolated client fixture home
      ansible.builtin.assert:
        that: fleet_home == (playbook_dir ~ '/../.ci-home/job-client')
        quiet: true
  tasks:
    - name: Create fixture SSH directory
      ansible.builtin.file:
        path: "{{ fleet_home }}/.ssh"
        state: directory
        mode: "0700"

    - name: Create a metadata-only dummy key
      ansible.builtin.copy:
        dest: "{{ fleet_home }}/.ssh/chaldea-job_ed25519"
        content: "metadata fixture, never a usable private key\n"
        mode: "0600"

    - name: Configure isolated compute SSH
      ansible.builtin.include_role:
        name: chaldea_job_client

    - name: Resolve the managed alias without connecting
      ansible.builtin.command:
        argv: [ssh, -G, -F, "{{ fleet_home }}/.ssh/chaldea-job.conf", chaldea-job-fixture]
      register: fixture_ssh
      changed_when: false

    - name: Assert every client-side restriction and multiplex setting
      ansible.builtin.assert:
        that:
          - "'hostname 192.0.2.123' in fixture_ssh.stdout_lines"
          - "'user chaldea-job' in fixture_ssh.stdout_lines"
          - "'port 2222' in fixture_ssh.stdout_lines"
          - "'identityagent none' in fixture_ssh.stdout_lines"
          - "'identitiesonly yes' in fixture_ssh.stdout_lines"
          - "'forwardagent no' in fixture_ssh.stdout_lines"
          - "'clearallforwardings yes' in fixture_ssh.stdout_lines"
          - "'controlmaster auto' in fixture_ssh.stdout_lines"
          - "'controlpersist 60' in fixture_ssh.stdout_lines"
          - "'stricthostkeychecking true' in fixture_ssh.stdout_lines"
        quiet: true

    - name: Make the dummy key too permissive
      ansible.builtin.file:
        path: "{{ fleet_home }}/.ssh/chaldea-job_ed25519"
        mode: "0644"

    - name: Require bad key metadata to fail enrollment
      block:
        - name: Try unsafe enrollment
          ansible.builtin.include_role:
            name: chaldea_job_client
        - name: Reject an incorrectly accepted key
          ansible.builtin.fail:
            msg: unsafe key was accepted
      rescue:
        - name: Verify rejection came from the key assertion
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Require a private key owned by the session user'
            quiet: true

- name: Exercise a waits-only host without a compute key
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    chaldea_node_version: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../inventory/group_vars/all/main.yml') | from_yaml).chaldea_node_version }}"
    fleet_home: "{{ playbook_dir }}/../.ci-home/waits-only"
    chaldea_job_client_enabled: false
    mcp_registrations_chaldea_waits_enabled: true
  pre_tasks:
    - name: Require an isolated waits fixture home
      ansible.builtin.assert:
        that: fleet_home == (playbook_dir ~ '/../.ci-home/waits-only')
        quiet: true
  tasks:
    - name: Configure the launcher on a waits-only host
      ansible.builtin.include_role:
        name: chaldea_job_client

    - name: Inspect the installed client and waits-only launchers
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../.ci-home/{{ item }}/.local/bin/chaldea"
      loop: [job-client, waits-only]
      register: fixture_launchers

    - name: Require executable launchers for compute clients and waits-only hosts
      ansible.builtin.assert:
        that:
          - item.stat.isreg
          - item.stat.mode == '0755'
        quiet: true
      loop: "{{ fixture_launchers.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Inspect SSH state on the waits-only host
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../.ci-home/waits-only/.ssh"
      register: fixture_waits_ssh

    - name: Require waits-only setup to leave compute SSH unconfigured
      ansible.builtin.assert:
        that: not fixture_waits_ssh.stat.exists
        quiet: true
