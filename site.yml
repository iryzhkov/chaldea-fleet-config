---
# Converges the host it runs on. Every inventory entry uses a local connection,
# so always limit a run to this host's entry (ansible-pull does it with --limit).
- name: Converge this host
  hosts: all
  gather_facts: true
  gather_subset: [min]
  pre_tasks:
    - name: Refuse to apply another host's configuration
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname == expected_hostname
        fail_msg: >-
          This machine is {{ ansible_facts.hostname }} but the inventory entry
          {{ inventory_hostname }} is for {{ expected_hostname }}; limit the run
          to this machine's entry.
        quiet: true
  # Each role is tagged with its name, so a run can skip one with --skip-tags.
  roles:
    - role: agent_tools
      tags: [agent_tools]
    - role: agent_config
      tags: [agent_config]
      when: "'agent_hosts' in group_names"
    - role: mise_agents
      tags: [mise_agents]
      when: "'agent_hosts' in group_names"
    - role: chaldea_client
      tags: [chaldea_client]
      when: "'agent_hosts' in group_names and chaldea_client_enabled | default(false) | bool"
    - role: huyang
      tags: [huyang]
      when: "'agent_hosts' in group_names and huyang_enabled | default(false) | bool"
    - role: mcp_registrations
      tags: [mcp_registrations]
      when: "'agent_hosts' in group_names"
    - role: t3
      tags: [t3]
      when: "'agent_hosts' in group_names and t3_enabled | bool"
    - role: data_disk
      tags: [data_disk]
      when: data_disk_root | default('') | length > 0
    - role: chaldea_job_host
      tags: [chaldea_job_host]
      when: chaldea_job_host_enabled | default(false) | bool
    - role: chaldea_job_client
      tags: [chaldea_job_client]
      when: >-
        chaldea_job_client_enabled | default(false) | bool
        or mcp_registrations_chaldea_waits_enabled | default(false) | bool
    - role: retention
      tags: [retention]
      when: "'agent_hosts' in group_names"
    - role: chaldea_access_trust
      tags: [chaldea_access_trust]
      when: chaldea_access_trust_enabled | default(false) | bool
    - role: chaldea_token_helper
      tags: [chaldea_token_helper]
      when: chaldea_token_helper_enabled | default(false) | bool
    - role: pull_timer
      tags: [pull_timer]
  # Discover after installers (including the Chaldea wrapper) have converged.
  post_tasks:
    - name: Generate installed custom tool discovery
      ansible.builtin.import_role:
        name: agent_config
        tasks_from: fleet-tools
      tags: [agent_config, fleet_tools]
      when: "'agent_hosts' in group_names"
