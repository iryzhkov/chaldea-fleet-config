---
# Reviewed desired-value reference. This example is outside inventory and no
# role loads it. The activation draft appends these entries to the full owning
# maps in inventory/host_vars/laptop/chaldea-jocasta-tooling.yml. HOLD that draft
# until root completes docs/laptop-ov-tooling-prepared.md's protected inputs.
# Never pass this file as extra vars: its keys are not role inputs.
#
# One limited, nondelegating Codex preset with one fixed OV service. Its grant
# is exactly the existing OV canary node, the same closed grant the infra
# enrollment gives chaldea-laptop-ov-tooling-codex. The profile home is a new
# operator-provisioned Codex login; it is never the Jocasta profile's home and
# never a copy of any existing auth cache.
ceilings:
  - project: tooling
    maxSeconds: 900
    destinations: [f29ad608-ef74-42e2-bc34-1d8c4f4c8dc5]
    services: &ov_tooling_services
      - audience: ov
        scope: ov.read
        ov_namespaces: [viking://resources/homeassistant-api/rest-api.md]
presets:
  ov-tooling-codex:
    instanceId: codex-ov-tooling
    model: gpt-6.1-sol
    options:
      - {id: reasoningEffort, value: high}
    runtimeMode: approval-required
    interactionMode: default
    projectId: mcp:2fe01b0e-5727-4111-9b95-ff81508562ba
    title: OV tooling metadata-only Codex
    prompt: >-
      Stay in ONE admitted native run until the wait and second granted call
      finish, within the unchanged 900-second deadline. Use only ov_tooling
      memory_stat for these MCP calls:
      1. Call memory_stat for viking://resources/homeassistant-api/rest-api.md;
      require success.
      2. Call memory_stat for
      viking://resources/homeassistant-api/ov-canary-denied-a63e197f;
      require server denial.
      3. Use the normal built-in terminal ONLY to execute the literal command
      /usr/bin/sleep 370. If it yields a process/session handle, use only the
      normal continuation/wait interface for that exact process, with no input,
      until successful exit. Do not finish this turn before that wait completes.
      No other commands, shell expressions, backgrounding, keepalives, clock
      changes, local data/files, web, delegation, helpers or MCP operations.
      The passive wait is timing only, not an authorization boundary.
      4. After successful wait completion, call memory_stat again for
      viking://resources/homeassistant-api/rest-api.md; require success in
      this SAME admitted session/run/provider/pinned profile before final output.
      On any call failure, unexpected allowance/denial, unavailable terminal,
      failed wait or insufficient deadline, stop safely with FAIL or INCOMPLETE;
      never claim renewal PASS. Do not change the preset/policy or extend TTL.
      Return only JSON at most 1000 UTF-8 bytes:
      {"v":1,"status":"PASS|FAIL|INCOMPLETE","allowed":"PASS|FAIL","denied":"DENIED|FAIL","renewal":"PASS|FAIL|INCOMPLETE","issues":[]}.
      Renewal PASS requires the second successful native RPC AND independent
      root trace verification of both calls and elapsed >=370 seconds in this
      same run. Without that verification report INCOMPLETE with issue
      TRACE_VERIFICATION_REQUIRED. Sleep or model self-report alone is not proof.
      Never include content, metadata values, credentials or headers.
    project: tooling
    services: *ov_tooling_services
    maxSeconds: 900
    delegate: false
    destinations: [f29ad608-ef74-42e2-bc34-1d8c4f4c8dc5]
enrollments:
  ov-tooling-codex:
    form: app_password
    audience: ov
    issuer: https://auth.ryzhkov.dev/application/o/ov-http-a63e197f/
    tokenUrl: https://auth.ryzhkov.dev/application/o/token/
    jwksUrl: https://auth.ryzhkov.dev/application/o/ov-http-a63e197f/jwks/
    clientId: ov-http-a63e197f-machine
    username: chaldea-laptop-ov-tooling-codex
    scope: ov.read
    ov_namespaces: [viking://resources/homeassistant-api/rest-api.md]
    resource: https://ov.mcp.ryzhkov.dev/mcp
    maxTokenSeconds: 300
    secretFile: /home/igor/.config/chaldea/authentik/ov-tooling-codex.app-password
profiles:
  ov-tooling-codex:
    driver: codex
    # The same reviewed Codex 0.163.0 assets as the qualified Jocasta Codex
    # profile; root rechecks them on the laptop before activation.
    native:
      source: /home/igor/.local/share/chaldea/provider-assets/codex/0.163.0/codex
      sha256: 8a96f66d059d653e68bfd5f3c79337e6f1d7d170d80bf705eb7d0249b34c0ece
      size: 257816200
    host:
      source: /home/igor/.local/share/chaldea/provider-assets/codex/0.163.0/codex-code-mode-host
      sha256: 255eccc8a5c1d267dc0acbc815cc83aaa1f50955bd99943b29f00cafcdcab771
      size: 67118080
    catalog:
      source: /home/igor/.local/share/chaldea/provider-assets/codex/0.163.0/models.json
      sha256: ad005892044dec4f817f431ff75302193e27bbfb7533958afe6a91194fd7b784
      size: 65174
    elf_machine: 183
    model: gpt-6.1-sol
    # A new, independently logged-in Codex home. Root provisions it; the role
    # only stats it and writes its .codex/config.toml.
    home: /home/igor/.local/state/chaldea/profiles/ov-tooling-codex/home
    tmpdir: /home/igor/.local/state/chaldea/profiles/ov-tooling-codex/tmp
    cwd: /home/igor
    preset: ov-tooling-codex
    audience: ov
    server: ov_tooling
    url: https://ov.mcp.ryzhkov.dev/mcp
    tools: [memory_stat]
    # Operator MCP servers that must never reach this session, in particular
    # the interactive OV and Jocasta servers with their own credentials.
    disabled_servers: [chaldea, huyang, jocasta, ov-memory]
