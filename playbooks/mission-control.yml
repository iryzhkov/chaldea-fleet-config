---
# Explicit local agent-a installation only. Normandy composition belongs to infra.
- name: Mission Control source capture
  hosts: all
  connection: local
  gather_facts: false
  become: true
  pre_tasks:
    - name: Require a literal one-host local invocation
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all == ['agent-a']
          - ansible_limit == 'agent-a'
          - ansible_connection == 'local'
        quiet: true
  roles:
    - mission_control_runtime
    - mission_control_capture
