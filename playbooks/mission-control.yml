---
# Explicit local agent-a or omarchy-pc installation only. Normandy composition belongs to infra.
- name: Mission Control source capture
  hosts: all
  connection: local
  gather_facts: false
  become: true
  pre_tasks:
    - name: Require a literal one-host local invocation
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all in [['agent-a'], ['omarchy-pc']]
          - ansible_limit == ansible_play_hosts_all[0]
          - ansible_connection == 'local'
        quiet: true
  roles:
    - mission_control_capture
    - mission_control_runtime
  tasks:
    - name: Verify and activate the staged capture
      ansible.builtin.include_role:
        name: mission_control_capture
        tasks_from: activate
