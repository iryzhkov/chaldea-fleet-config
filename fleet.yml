---
- name: Controller topology guard
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Refuse missing runner before any target play
      ansible.builtin.assert:
        that:
          - groups.get('pull_runner', []) | length == 1
          - groups.get('fleet_targets', []) | length > 0
          - groups.get('pull_runner', []) | difference(groups.get('fleet_targets', [])) | length == 0
          - not (pull_timer_enabled | default(false) | bool)
          - not (live_preflight_enabled | default(false) | bool)
        fail_msg: Invalid topology or unfinished intent refused before target contact
    - name: Refuse unfinished intent on every target without connections
      ansible.builtin.assert:
        that:
          - not (hostvars[item].pull_timer_enabled | default(false) | bool)
          - not (hostvars[item].live_preflight_enabled | default(false) | bool)
          - not (hostvars[item].adopted | default(false) | bool)
        fail_msg: Unfinished intent refused before target contact
      loop: "{{ groups.get('fleet_targets', []) }}"

- name: Controller offline validation
  hosts: pull_runner
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Validate topology locally before target contact
      ansible.builtin.assert:
        that:
          - groups['pull_runner'] | length == 1
          - groups['fleet_targets'] | length > 0
          - not (pull_timer_enabled | default(false) | bool)
          - not (live_preflight_enabled | default(false) | bool)
        fail_msg: Unfinished live preflight or timer intent refused
      delegate_to: localhost
    - name: Refuse unfinished adoption before remote access
      ansible.builtin.assert:
        that:
          - hostvars[item].adopted is defined
          - hostvars[item].adopted is boolean
          - not hostvars[item].adopted
          - hostvars[item].desired_role in ['worker', 'coordinator']
          - hostvars[item].desired_order is integer
          - hostvars[item].ansible_connection in ['local', 'ssh']
        fail_msg: Unfinished adoption refused before target contact
      loop: "{{ groups['fleet_targets'] }}"
      delegate_to: localhost
    - name: Derive mutation membership from validated adoption
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: "adopted_{{ hostvars[item].desired_role }}"
      loop: "{{ groups['fleet_targets'] }}"
      when: hostvars[item].adopted
      delegate_to: localhost
    - name: Validate offline scaffold
      ansible.builtin.include_role:
        name: preflight

- name: Ordered worker convergence boundary
  hosts: adopted_worker
  gather_facts: false
  order: inventory
  serial: 1
  any_errors_fatal: true
  roles:
    - worker

- name: Coordinator last convergence boundary
  hosts: adopted_coordinator
  gather_facts: false
  order: inventory
  serial: 1
  any_errors_fatal: true
  roles:
    - coordinator
